<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Error Message Component</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="text-center p-8 bg-white rounded-lg shadow-sm max-w-md mx-auto">
    <div class="text-red-500 text-6xl mb-4">⚠️</div>
    <h2 class="text-2xl font-semibold text-gray-800 mb-2">Content Unavailable</h2>
    <p class="text-gray-600 mb-4">The requested content could not be loaded. This may be due to a network issue or the content may no longer be available.</p>
    <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition-colors duration-200">Try Again</button>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
