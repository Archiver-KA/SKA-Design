<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Elevated Notification Card</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="relative w-full max-w-xl bg-slate-50">
  <div class="absolute -top-5 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] h-9 rounded-2xl bg-violet-400/35 shadow-[0_6px_20px_rgba(124,58,237,0.25)]"></div>
  <article class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-violet-600 to-purple-600 text-white shadow-2xl ring-1 ring-white/15">
    <div class="pointer-events-none absolute inset-x-0 -top-10 h-24 bg-gradient-to-b from-white/40 to-transparent"></div>
    <div class="p-4 sm:p-5">
      <div class="flex items-start gap-3">
        <div class="shrink-0 rounded-xl bg-gradient-to-b from-slate-900 to-slate-800 p-2.5 ring-1 ring-white/10 shadow-md">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l14 9-14 9V3z"></path>
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-3">
            <h3 class="text-[15px] sm:text-base font-semibold tracking-tight truncate">Topic Suggestion: Hobbies</h3>
            <span class="text-xs sm:text-sm text-white/85 shrink-0">10s ago</span>
          </div>
          <p class="mt-1 text-sm leading-6 text-white/90">
            Ask about their favorite hobbies or recent activities they've enjoyed. It's a great way to find common interests.
          </p>
        </div>
      </div>
    </div>
  </article>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
