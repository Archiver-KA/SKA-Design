<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YouTube Shorts with Title Header</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
  <div class="p-4 border-b border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900">Featured Short</h3>
    <p class="text-sm text-gray-600 mt-1">Watch this amazing content</p>
  </div>
  <div class="relative bg-black" style="padding-bottom: 177.78%;">
    <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/7KKQYmHCeaI" title="YouTube Shorts video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen=""></iframe>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
