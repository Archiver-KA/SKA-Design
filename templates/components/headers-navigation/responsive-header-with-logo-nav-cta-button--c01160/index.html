<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive Header with Logo, Nav &amp; CTA Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><header class="border-amber-900/20 border-b relative" data-element-locator="html &gt; body:nth-of-type(1) &gt; header:nth-of-type(1)">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between py-5">
          <!-- Brand Logo -->
          <a href="#" class="flex items-center gap-3">
            <span class="bg-center text-3xl italic text-white tracking-tight font-script w-[120px] h-[36px] bg-[url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20143%2080%27%20width=%27143%27%20height=%2780%27%3E%3Ctext%20x=%2772%27%20y=%2745%27%20text-anchor=%27middle%27%20font-family=%27Segoe%20UI%2CHelvetica%2CArial%2Csans-serif%27%20font-weight=%27700%27%20font-size=%2715%27%20fill=%27%23f5f5f5%27%3ERoasted%20Roots%3C/text%3E%3C/svg%3E)] bg-cover"></span>
          </a>

          <!-- Nav -->
          <nav class="hidden md:flex items-center gap-8 text-sm text-neutral-300 font-sans">
            <a href="#" class="hover:text-amber-400 transition-colors">
              Our Story
            </a>
            <a href="#" class="hover:text-amber-400 transition-colors">
              Coffee Selection
            </a>
            <a href="#" class="hover:text-amber-400 transition-colors">
              Brewing Guides
            </a>
            <a href="#" class="hover:text-amber-400 transition-colors">
              Visit Us
            </a>
          </nav>

          <!-- Actions -->
          <div class="flex items-center gap-3">
            <button class="group relative w-auto cursor-pointer select-none text-base leading-7 flex transition-all duration-200 ease-out focus:outline-none hover:brightness-95 active:brightness-90 font-semibold text-[#1a1614] bg-amber-400 border-0 pt-2.5 pr-6 pb-2.5 pl-6 rotate-[-1deg] items-center justify-center rounded font-sans">
              <span class="relative z-10">Subscribe</span>
              <span aria-hidden="true" class="pointer-events-none absolute border border-[#1a1614] bottom-1 left-1 w-[calc(100%-1px)] h-[calc(100%-1px)] transition-all duration-200 ease-out group-hover:bottom-0.5 group-hover:left-0.5 rounded"></span>
            </button>
          </div>
        </div>
      </div>
    </header></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
