<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Typing Text Effect Header</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="typing-text-component">
  <style>/* Blinking cursor effect */
    #text-target-sinera-emiz19wlbnx3r575 {
      border-right: 3px solid currentColor;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
      vertical-align: bottom;
      animation: blink-cursor 0.75s step-end infinite;
    }

    /* Cursor blink animation */
    @keyframes blink-cursor {
      from, to { border-color: transparent }
      50% { border-color: currentColor; }
    }</style>
  <div class="inline-block">
    <span id="text-target-sinera-emiz19wlbnx3r575" class="text-4xl font-bold text-gray-900"></span>
  </div>
  <script>(function() {
      // Configuration
      const elementId = "text-target-sinera-emiz19wlbnx3r575";
      const words = ["Automatiza", "Escala", "Rentabiliza"];
      const typeSpeed = 100; speed (ms)
      const deleteSpeed = 50;   // Deleting speed (ms)
      const pauseTime = 2000;   // Pause before deleting (ms)

      // Internal variables
      let wordIndex = 0;
      let charIndex = 0;
      let isDeleting = false;
      const element = document.getElementById(elementId);

      function type() {
        const currentWord = words[wordIndex];

        if (isDeleting) {
          // Deleting
          element.textContent = currentWord.substring(0, charIndex - 1);
          charIndex--;
        } else {
          // Typing
          element.textContent = currentWord.substring(0, charIndex + 1);
          charIndex++;
        }

        // Dynamic speed
        let currentSpeed = isDeleting ? deleteSpeed : typeSpeed;

        // If word is complete
        if (!isDeleting && charIndex === currentWord.length) {
          currentSpeed = pauseTime; // Long pause for reading
          isDeleting = true;
        } 
        // If word is completely deleted
        else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          wordIndex++;
          if (wordIndex === words.length) {
            wordIndex = 0; // Restart cycle
          }
        }

        setTimeout(type, currentSpeed);
      }

      // Start if element exists
      if (element) {
        type();
      } else {
        console.error("Element not found with ID: " + elementId);
      }
    })();</script>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
