<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Presenter and WhatsApp Info Bar</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="flex flex-col sm:flex-row sm:items-center mb-16 gap-x-4 gap-y-4 items-start justify-between">
                <div class="text-xs font-medium text-slate-500 tracking-wide">
                    Presented by: <span class="text-slate-400">Wealth Management System Inc.</span>
                </div>
                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-white/10 bg-white/[0.02] hover:bg-white/[0.04] transition-colors cursor-pointer text-xs font-medium text-slate-300">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                    WhatsApp: <span class="text-white ml-0.5 tracking-tight">(815) 8-WEALTH</span>
                </div>
            </div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
