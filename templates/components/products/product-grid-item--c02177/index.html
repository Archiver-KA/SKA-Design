<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product Grid Item</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full sm:w-64 p-3">
  <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300">
    <div class="aspect-square p-4 bg-gray-50 rounded-t-lg">
      <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=1200&q=80" alt="Product" class="w-full h-full object-contain" loading="lazy" />
    </div>
    <div class="p-4">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Product Name</h3>
      <p class="text-gray-600 text-sm mb-3">Product description goes here</p>
      <div class="flex items-center justify-between">
        <span class="text-xl font-bold text-gray-900">€12.99</span>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2
          rounded-md text-sm font-medium transition-colors
          duration-200">Add to Cart</button>
      </div>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
