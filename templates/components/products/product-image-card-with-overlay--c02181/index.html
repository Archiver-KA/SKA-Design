<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product Image Card with Overlay</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full max-w-md mx-auto">
  <div class="relative group overflow-hidden rounded-lg shadow-lg bg-white">
    <img src="https://cdn.shopify.com/s/files/1/0908/9489/3329/files/Playpark_Lodge_Sold_Thumbnail.jpg?v=1765483980" alt="Playpark Lodge" class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" />
    <div class="absolute top-4 right-4 bg-red-600 text-white px-3 py-1 rounded-full text-sm font-semibold shadow-md">SOLD</div>
    <div class="absolute bottom-4 left-4 text-white">
      <h3 class="text-xl font-bold">Playpark Lodge</h3>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
