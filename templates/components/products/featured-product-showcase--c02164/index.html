<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Featured Product Showcase</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full max-w-4xl mx-auto">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');</style>
  <div class="bg-white rounded-2xl shadow-lg overflow-hidden" style="font-family: 'Inter', 'Helvetica Neue', sans-serif;">
    <div class="grid md:grid-cols-2 gap-0">
      <div class="bg-gray-50 p-4 md:p-6 flex items-center justify-center">
        <img src="https://images.unsplash.com/photo-1524143986875-3b098d78b363?auto=format&fit=crop&w=1200&q=80" alt="Featured Product" class="w-full h-auto object-cover rounded-lg" loading="lazy" />

        <p class="text-gray-600 mb-6 leading-relaxed">Discover our premium selection with exceptional quality and design. Perfect for your everyday needs.</p>
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3

    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
