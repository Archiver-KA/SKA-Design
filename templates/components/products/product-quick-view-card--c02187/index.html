<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product Quick View Card</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full max-w-xs mx-auto">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');</style>
  <div class="bg-white rounded-xl shadow-md overflow-hidden group relative" style="font-family: 'Inter', 'Helvetica Neue', sans-serif;">
    <div class="relative overflow-hidden">
      <img src="https://images.unsplash.com/photo-1627384113972-f4c0392fe5aa?auto=format&fit=crop&w=1200&q=80" alt="Product" class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/60
        to-transparent opacity-0 group-hover:opacity-100
        transition-opacity duration-300 flex items-end
        justify-center pb-6">
        <button class="bg-white hover:bg-gray-100 text-gray-900 font-medium py-2
          px-6 rounded-full transition-colors duration-200 transform
          translate-y-4 group-hover:translate-y-0">Quick View</button>
      </div>
    </div>
    <div class="p-4">
      <h3 class="text-lg font-semibold text-gray-900 mb-1">Product Name</h3>
      <p class="text-sm text-gray-500">€29.99</p>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
