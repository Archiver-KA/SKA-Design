<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient V Logo SVG Icon</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Coral to Gold Gradient (Left to Right) -->
    <linearGradient id="vyrality-main" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    
    <!-- Ignition Point Radial Glow -->
    <radialGradient id="ignition" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- V Shape - Stroke Based with Rounded Caps -->
  <path 
    d="M 18 28 
       C 18 26, 20 24, 22 26
       L 50 62
       L 78 26
       C 80 24, 82 26, 82 28
       L 50 75
       C 50 76, 50 76, 50 75
       L 18 28 Z"
    fill="url(#vyrality-main)"
    stroke="none"
  />
  
  <!-- Inner Cutout Triangle -->
  <path 
    d="M 32 35 
       L 50 58 
       L 68 35 
       C 60 45, 40 45, 32 35 Z"
    fill="#000000"
  />
  
  <!-- Ignition Glow (larger, softer) -->
  <ellipse 
    cx="50" 
    cy="52" 
    rx="8" 
    ry="6" 
    fill="url(#ignition)"
    filter="url(#glow)"
    opacity="0.9"
  />
  
  <!-- Ignition Core (bright center) -->
  <ellipse 
    cx="50" 
    cy="52" 
    rx="2.5" 
    ry="2" 
    fill="#FEF3C7"
  />
</svg></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
