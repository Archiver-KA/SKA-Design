<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Email Signup CTA Card</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="flex flex-col min-h-[420px] lg:col-span-1 animate-scale-fade delay-1100 bg-white bg-[url(https://images.unsplash.com/photo-1541462608143-67571c6738dd?auto=format&fit=crop&w=800&q=80)] bg-cover rounded-3xl pt-8 pr-8 pb-8 pl-8 shadow-xl justify-between">
        <div class="space-y-6">
          <p class="text-sm text-slate-500 font-sans animate-fade-slide delay-1200" style="">Join thousands</p>
          <h2 class="display sm:text-4xl leading-tight uppercase text-3xl font-medium text-slate-900 font-manrope animate-fade-blur delay-1300" style="">Begin Your Journey Now</h2>
        </div>
        <form class="flex flex-col gap-4 pt-6 animate-fade-slide delay-1400">
          <input type="email" required="" placeholder="work@company.com" class="flex-1 px-5 py-3 rounded-full border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm placeholder:text-slate-400">
          <button type="submit" class="px-6 py-3 rounded-full bg-indigo-600 hover:bg-indigo-700 transition-colors text-white text-sm flex items-center justify-center gap-2 font-sans" style="">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4"><path d="M5 12h14" class=""></path><path d="m12 5 7 7-7 7" class=""></path></svg>
            Continue
          </button>
        </form>
      </div></div><script>try{lucide.createIcons()}catch(e){}</script><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
