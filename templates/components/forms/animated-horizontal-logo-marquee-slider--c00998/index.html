<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Horizontal Logo Marquee Slider</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><section class="relative w-full overflow-hidden py-8" style="mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);">
  <!-- 200% track that slides by 50% -->
  <div class="flex w-[200%] animate-marquee-x hover:[animation-play-state:paused]" style="--duration: 40s;">
    <!-- First half -->
    <ul class="flex w-1/2 shrink-0 items-center">
      <!-- Each item gets equal space with flex-1 -->
      <li class="flex-1 text-center px-8 py-3">Apple</li>
      <li class="flex-1 text-center px-8 py-3">Google</li>
      <li class="flex-1 text-center px-8 py-3">Figma</li>
      <li class="flex-1 text-center px-8 py-3">Stripe</li>
      <li class="flex-1 text-center px-8 py-3">Linear</li>
      <li class="flex-1 text-center px-8 py-3">Notion</li>
    </ul>

    <!-- Duplicate half (must match 1:1 for a seamless loop) -->
    <ul class="flex w-1/2 shrink-0 items-center" aria-hidden="true">
      <li class="flex-1 text-center px-8 py-3">Apple</li>
      <li class="flex-1 text-center px-8 py-3">Google</li>
      <li class="flex-1 text-center px-8 py-3">Figma</li>
      <li class="flex-1 text-center px-8 py-3">Stripe</li>
      <li class="flex-1 text-center px-8 py-3">Linear</li>
      <li class="flex-1 text-center px-8 py-3">Notion</li>
    </ul>
  </div>
  <style>
    @keyframes marquee-x {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .animate-marquee-x {
      animation: marquee-x var(--duration, 30s) linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-marquee-x {
        animation: none;
        transform: none;
      }
    }
  </style>
</section></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
