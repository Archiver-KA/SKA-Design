<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interactive Tailwind Sign Up Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="cursor-pointer inline-block no-underline select-none touch-manipulation align-baseline whitespace-nowrap outline-none relative hover:bg-blue-200 hover:text-blue-800 focus:bg-blue-200 focus:text-blue-800 focus:ring-4 focus:ring-blue-500/15 active:bg-blue-300 active:text-blue-800 active:shadow-none transition-all duration-75 text-sm font-normal text-blue-700 text-center bg-blue-100 border-blue-300 border rounded mt-0 mr-0 mb-0 ml-0" style="font-family: -apple-system, system-ui, 'Segoe UI', 'Liberation Sans', sans-serif; box-shadow: rgba(255, 255, 255, .7) 0 1px 0 0 inset; line-height: 1.15385; padding: 8px 0.8em;" role="button">Sign Up</button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
