<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upsell Toggle Card with Price Display</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="ring-1 ring-black/10 flex flex-col bg-black/5 rounded-2xl pt-5 pr-5 pb-5 pl-5 justify-between">
              <div>
                <p class="text-base font-medium tracking-tight font-geist">Need growth acceleration?</p>
                <p class="mt-2 text-sm text-black/70 font-geist">Add strategic marketing and SEO optimization.</p>
              </div>
              <div class="mt-8 flex items-center justify-between">
                <div class="text-sm font-geist">
                  <span class="text-black/90">+ $1,850</span>
                </div>
                <button type="button" role="switch" aria-checked="false" data-upsell-switch="" class="inline-flex h-6 w-11 items-center rounded-full bg-black/10 ring-1 ring-black/10 transition-colors duration-200">
                  <span data-upsell-knob="" class="h-4 w-4 translate-x-0 rounded-full bg-black transition-transform duration-200"></span>
                  <span class="sr-only">Toggle Growth Package add-on</span>
                </button>
              </div>
            </div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
