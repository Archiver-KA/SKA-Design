<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Indigo Tailwind Sign-In Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="cursor-pointer inline-block leading-tight outline-none relative no-underline select-none touch-manipulation align-baseline whitespace-nowrap hover:bg-indigo-600 focus:bg-indigo-600 focus:ring-4 focus:ring-indigo-500/15 active:bg-indigo-700 active:shadow-none transition-all duration-75 text-sm font-normal text-white text-center bg-indigo-500 border-transparent border rounded mt-0 mr-0 mb-0 ml-0 pt-2 pr-3 pb-2 pl-3" style="font-family: -apple-system, system-ui, 'Segoe UI', 'Liberation Sans', sans-serif; box-shadow: rgba(255, 255, 255, .4) 0 1px 0 0 inset; line-height: 1.15385; padding: 8px 0.8em;" role="button">Sign In</button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
