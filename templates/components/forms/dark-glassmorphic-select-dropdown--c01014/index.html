<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dark Glassmorphic Select Dropdown</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div>
  <label for="project-type" class="block text-xs font-medium text-white/80 mb-1">Project type</label>
  <select id="project-type" name="projectType" class="w-full appearance-none outline-none focus:ring-2
    focus:ring-amber-400/60 focus:border-amber-300 transition
    text-sm text-white bg-white/10 border-white/10 border
    rounded-xl pt-2.5 pr-3 pb-2.5 pl-3">
    <option class="bg-neutral-900" value="product">New product build</option>
    <option class="bg-neutral-900" value="feature">Feature delivery</option>
    <option class="bg-neutral-900" value="advisory">Advisory / audit</option>
    <option class="bg-neutral-900" value="ai">AI integration</option>
  </select>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
