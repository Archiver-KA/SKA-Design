<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3D Hover Flip Sign Up Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="scene">
  <div class="cube">
    <span class="side top">Sign Up</span>
    <span class="side front">Sign Up</span>
  </div>
  <style>
    .scene {
      width: 10em;
      justify-content: center;
      align-items: center;
    }
  
    .cube {
      color: #ccc;
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
      transition: all 0.85s cubic-bezier(.17, .67, .14, .93);
      transform-style: preserve-3d;
      transform-origin: 100% 50%;
      width: 10em;
      height: 4em;
    }
  
    .cube:hover {
      transform: rotateX(-90deg);
    }
  
    .side {
      box-sizing: border-box;
      position: absolute;
      display: inline-block;
      height: 4em;
      width: 10em;
      text-align: center;
      text-transform: uppercase;
      padding-top: calc(1.5em - 4px);
      font-weight: bold;
    }
  
    .top {
      background: #2563eb;
      color: #fff;
      transform: rotateX(90deg) translate3d(0, 0, 2em);
      border: 1px solid #000;
    }
  
    .front {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      transform: translate3d(0, 0, 2em);
    }
  </style>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
