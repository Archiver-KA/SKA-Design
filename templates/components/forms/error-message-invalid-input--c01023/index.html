<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Error Message - Invalid Input</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="bg-red-50 border border-red-200 rounded-lg p-6 max-w-2xl mx-auto">
  <div class="flex items-start space-x-3">
    <svg class="w-6 h-6 text-red-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <div class="flex-1">
      <h3 class="text-lg font-semibold text-red-900 mb-1">Invalid Input</h3>
      <p class="text-red-700 text-sm leading-relaxed">The provided input appears to be a URL link, not HTML code. Please paste the actual HTML markup that you want analyzed and converted into reusable UI components.</p>
      <div class="mt-4 p-3 bg-white rounded border border-red-100">
        <p class="text-xs text-gray-600 mb-2 font-medium">Expected format:</p>
        <code class="text-xs text-gray-800 block"><div class="container">...</div></code>
      </div>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
