<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Testimonial Card with Avatar and Quote Icon</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div
  class="flex flex-col overflow-hidden bg-[#0a0a0a] h-full rounded-[31px] pt-8 pr-8 pb-8 pl-8 relative justify-between">
  <div class="z-10 relative">
    <div class="flex text-neutral-400 bg-neutral-800 w-8 h-8 rounded-full mb-6 items-center justify-center">
      <iconify-icon icon="solar:quote-up-bold" width="16"></iconify-icon>
    </div>
    <p class="text-neutral-300 text-sm leading-relaxed mb-6">"The automation tools took our personalization to the end
      level. Truly effortless."</p>
  </div>
  <div class="relative z-10 flex items-center gap-3">
    <img src="https://i.pravatar.cc/100?img=11" alt="Sarah K" class="opacity-80 w-8 h-8 object-cover bg-center rounded-full grayscale border border-white/10">
    <div>
      <div class="text-white font-medium text-sm">Sarah K. Hudson</div>
      <div class="text-neutral-500 text-xs font-mono uppercase">Hudson Algo</div>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
