<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive Metrics &amp; Image Grid Section</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl">
  <!-- Metric Card -->

    class="md:p-6 h-72 flex flex-col ring-1 ring-indigo-50 bg-gradient-to-br from-indigo-50 to-violet-50 rounded-2xl pt-5 pr-5 pb-5 pl-5 justify-between">
    <div class="flex items-center justify-between">
      <div class="">

      </div>
      <div class="text-sm text-slate-500">Q2 2025</div>
    </div>
    <p class="text-sm text-indigo-800 opacity-90">Customers reduce turnaround and scale support without growing
      headcount.</p>
  </article>

  <!-- Large image -->
  <article class="rounded-2xl overflow-hidden h-72 md:h-72">

  </article>

  <!-- Right small image -->
  <article class="rounded-2xl overflow-hidden h-72">
    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4d2f892c-1a8f-4733-920a-6b2b10cc656a_800w.jpg" alt="team discussion" class="w-full h-full object-cover" style="">
  </article>

  <!-- bottom left face -->

    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/9d230d27-880b-420e-8e5d-f8db82dfc9bc_800w.jpg" alt="face portrait" class="w-full h-full object-cover" style="">
  </article>

  <!-- bottom center render -->
  <article class="rounded-2xl overflow-hidden h-48 md:h-48">
    <img src="https://images.unsplash.com/photo-1720962158919-6c5f5f99630d?auto=format&fit=crop&w=800&q=80" alt="3d render" class="w-full h-full object-cover" style="">

    <p class="text-sm mt-2 text-yellow-800/90">monthly interactions handled with confidence</p>
  </article>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
