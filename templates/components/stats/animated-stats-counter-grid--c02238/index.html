<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Stats Counter Grid</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="scroll-reveal stagger-4 grid grid-cols-2 md:grid-cols-4 gap-8 revealed mb-16" id="hero-stats">
  <div class="text-center">
    <div class="text-3xl md:text-4xl font-light text-white mb-2" data-target="2847" data-suffix="">2,847</div>
    <div class="text-sm text-gray-400">Companies Transformed</div>
  </div>
  <div class="text-center">
    <div class="text-3xl md:text-4xl font-light text-white mb-2" data-target="247" data-suffix="%">247%</div>
    <div class="text-sm text-gray-400">Efficiency Increase</div>
  </div>
  <div class="text-center">
    <div class="text-3xl md:text-4xl font-light text-white mb-2" data-target="127" data-prefix="$" data-suffix="M">$127M
    </div>
    <div class="text-sm text-gray-400">Cost Savings</div>
  </div>
  <div class="text-center">
    <div class="md:text-4xl text-3xl font-light text-white mb-2" data-target="43" data-suffix="">43</div>
    <div class="text-sm text-gray-400">Countries Served</div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
