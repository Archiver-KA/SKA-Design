<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Metrics Section with Animated Counters</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><section
  class="border-x flex flex-col overflow-hidden bg-[#050508] w-full border-white/10 pt-32 pb-32 relative items-center"
 
 >
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full text-center pointer-events-none select-none z-0"
   
   >
    <span class="text-[18vw] font-bold text-white/[0.02] tracking-tighter leading-none block">IMPACT</span>
  </div>
  <div class="relative z-10 flex flex-col items-center text-center px-4 w-full"
   
   >
    <div class="reveal-up"
      style="transition-delay: 0ms;">
      <h2 class="text-3xl md:text-5xl font-semibold tracking-tight text-white mb-10 max-w-xl leading-tight"
       
       >Drive engagement with interactive 3D.</h2>
    </div>
    <div class="reveal-up"
      style="transition-delay: 100ms;">
      <div class="flex items-center gap-4 text-white/40 mb-20"
       ><iconify-icon
          icon="solar:monitor-linear" class="text-xl"
         
         ></iconify-icon><iconify-icon icon="solar:play-circle-linear" class="text-xl"
         
         ></iconify-icon><iconify-icon
          icon="solar:microphone-linear" class="text-xl"
         
         ></iconify-icon><iconify-icon icon="solar:camera-linear" class="text-xl"
         
         ></iconify-icon></div>
    </div>
    <div class="reveal-up"
      style="transition-delay: 200ms;">
      <p class="text-sm text-white/60 mb-12"
       >Performance metrics across XR campaigns:</p>
    </div>
    <div class="flex flex-col md:flex-row items-center justify-center gap-16 md:gap-24 mb-16 w-full"
     
     >
      <div class="reveal-up flex flex-col items-center md:items-start text-center md:text-left"
       
        style="transition-delay: 300ms;">
        <div class="text-5xl md:text-6xl font-medium tracking-tighter text-white/40 mb-2"
         
         >
          <span>0</span><span class="text-3xl">%</span>
        </div>
        <div class="text-xs tracking-widest uppercase text-white/20 font-medium"
         
         >Interaction<br>Rate
        </div>
      </div>
      <div class="reveal-scale flex flex-col items-center md:items-start text-center md:text-left scale-110"
       
        style="transition-delay: 400ms;">
        <div
          class="text-6xl md:text-7xl font-semibold tracking-tighter text-orange-400 mb-2 drop-shadow-[0_0_15px_rgba(251,146,60,0.3)]"
         
         >
          <span>0</span><span class="text-4xl">%</span>
        </div>
        <div class="text-xs tracking-widest uppercase text-orange-400/80 font-medium"
         
         >Conversion<br>Lift
        </div>
      </div>
      <div class="reveal-up flex flex-col items-center md:items-start text-center md:text-left"
       
        style="transition-delay: 500ms;">
        <div class="text-5xl md:text-6xl font-medium tracking-tighter text-white/40 mb-2"
         
         >
          <span>0</span><span class="text-3xl">%</span>
        </div>
        <div class="text-xs tracking-widest uppercase text-white/20 font-medium"
         
         >Retention<br>Growth
        </div>
      </div>
    </div>
    <div class="reveal-up w-full flex justify-center"
     
      style="transition-delay: 600ms;">
      <div class="w-full max-w-md h-[2px] bg-white/10 relative rounded-full overflow-hidden"
       
       >
        <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-purple-500 to-orange-400 w-2/3"
         
         ></div>
      </div>
    </div>
  </div>
</section></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
