<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hoverable Feature Card with Icon</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="group rounded-2xl bg-white ring-1 ring-black/10 p-5 transition-colors">
      <div class="flex items-center justify-between">

      </div>

        </div>
        <p class="mt-4 text-neutral-900 font-medium tracking-tight transition-colors group-hover:text-emerald-700">E-ink Display</p>
        <p class="text-neutral-600 text-sm transition-colors group-hover:text-emerald-600">Paper-like clarity</p>
      </div>
    </div></div><script>try{lucide.createIcons()}catch(e){}</script><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
