<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive Background Image Section</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full">
  <div class="w-full min-h-screen bg-cover bg-center bg-no-repeat relative" style="background-image: url('https://images.unsplash.com/photo-1616047006789-b7af5afb8c20?auto=format&fit=crop&w=1200&q=80');" data-thumb="https://images.unsplash.com/photo-1523755231516-e43fd2e8dca5?auto=format&fit=crop&w=1200&q=80" data-desktop="https://images.unsplash.com/photo-1616047006789-b7af5afb8c20?auto=format&fit=crop&w=1200&q=80" data-tablet="https://images.unsplash.com/photo-1554995207-c18c203602cb?auto=format&fit=crop&w=1200&q=80" data-mobile="https://images.unsplash.com/photo-1523755231516-e43fd2e8dca5?auto=format&fit=crop&w=1200&q=80"></div>
  <script>(function() {
      const bgSection = document.currentScript.previousElementSibling;
      
      function updateBackground() {
        const width = window.innerWidth;
        let imageUrl;
        
        if (width < 768) {
          imageUrl = bgSection.getAttribute('data-mobile');
        } else if (width < 1024) {
          imageUrl = bgSection.getAttribute('data-tablet');
        } else {
          imageUrl = bgSection.getAttribute('data-desktop');
        }
        
        if (imageUrl) {
          bgSection.style.backgroundImage = `url('${imageUrl}')`;
        }
      }
      
      updateBackground();
      window.addEventListener('resize', updateBackground);
    })();</script>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
