<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interactive Image Card with</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full max-w-2xl mx-auto">
  <div class="relative group overflow-hidden rounded-xl shadow-xl bg-gray-900">
    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/366dc3f4-74dc-4d5b-9c9b-9ff9993cb225_3840w.jpg" alt="Interactive Image" class="w-full h-auto object-cover transition-transform duration-300 group-hover:scale-110" loading="lazy" />
    <div class="absolute inset-0 bg-black bg-opacity-0
      group-hover:bg-opacity-50 transition-all duration-300 flex
      items-center justify-center">
      <div class="text-white text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-4">
        <h3 class="text-2xl font-bold mb-2">Image Title</h3>
        <p class="text-sm">Hover to see more details</p>
      </div>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
