<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unicorn Studio Interactive Animation Canvas</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="w-full max-w-5xl mx-auto bg-white rounded-lg shadow-sm overflow-hidden">
  <div data-us-project="NyoQvEiBN1V5cR4uBKOi" class="w-full aspect-[4/3]" style="min-height: 400px;"></div>
  <script type="text/javascript">(function() {
      var u = window.UnicornStudio;
      if (u && u.init) {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function() {
            u.init();
          });
        } else {
          u.init();
        }
      } else {
        window.UnicornStudio = {isInitialized: false};
        var i = document.createElement("script");
        i.src = "https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.0.5/dist/unicornStudio.umd.js";
        i.onload = function() {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function() {
              UnicornStudio.init();
            });
          } else {
            UnicornStudio.init();
          }
        };
        (document.head || document.body).appendChild(i);
      }
    })();</script>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
