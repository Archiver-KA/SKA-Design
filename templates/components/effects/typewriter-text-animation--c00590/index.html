<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Typewriter Text Animation</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="inline-block">
  <style>#text-target-sinera-emiz19wlbnx3r575 {
      border-right: 3px solid currentColor;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
      vertical-align: bottom;
      animation: blink-cursor 0.75s step-end infinite;
    }

    @keyframes blink-cursor {
      from, to { border-color: transparent }
      50% { border-color: currentColor; } 
    }</style>
  <span id="text-target-sinera-emiz19wlbnx3r575"></span>
  <script>(function() {
      const elementId = "text-target-sinera-emiz19wlbnx3r575";
      const words = ["Automatiza", "Escala", "Rentabiliza"];
      const typeSpeed = 100;
      const deleteSpeed = 50;
      const pauseTime = 2000;

      let wordIndex = 0;
      let charIndex = 0;
      let isDeleting = false;
      const element = document.getElementById(elementId);

      function type() {
        const currentWord = words[wordIndex];

        if (isDeleting) {
          element.textContent = currentWord.substring(0, charIndex - 1);
          charIndex--;
        } else {
          element.textContent = currentWord.substring(0, charIndex + 1);
          charIndex++;
        }

        let currentSpeed = isDeleting ? deleteSpeed : typeSpeed;

        if (!isDeleting && charIndex === currentWord.length) {
          currentSpeed = pauseTime;
          isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          wordIndex++;
          if (wordIndex === words.length) {
            wordIndex = 0;
          }
        }

        setTimeout(type, currentSpeed);
      }

      if (element) {
        type();
      } else {
        console.error("No se encontró el elemento con ID: " + elementId);
      }
    })();</script>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
