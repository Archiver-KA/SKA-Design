<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizontal Scroll Container</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="overflow-x-auto snap-x snap-mandatory w-full pb-4">
  <style>.scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }</style>
  <div class="overflow-x-auto snap-x snap-mandatory scrollbar-hide w-full pb-4">
    <div class="flex gap-4 sm:mx-0 sm:px-[max(1.5rem,calc((100vw-64rem)/2))] w-max mr-auto ml-auto pr-6 pl-6">
      <div class="snap-center shrink-0 w-[85vw] sm:w-[300px] h-48
        bg-neutral-800 rounded-lg flex items-center justify-center
        text-white">Item 1</div>
      <div class="snap-center shrink-0 w-[85vw] sm:w-[300px] h-48
        bg-neutral-800 rounded-lg flex items-center justify-center
        text-white">Item 2</div>
      <div class="snap-center shrink-0 w-[85vw] sm:w-[300px] h-48
        bg-neutral-800 rounded-lg flex items-center justify-center
        text-white">Item 3</div>
    </div>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
