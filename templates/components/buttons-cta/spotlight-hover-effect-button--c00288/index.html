<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spotlight Hover Effect Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><style>
/* 19. SPOTLIGHT FIXED VERSION */
.btn-spotlight {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.9rem 2rem;
  width: 100%;
  background: rgba(20,20,20,0.6);
  border: 1px solid rgba(80,255,80,0.25);
  border-radius: 18px;
  color: #aaa;
  font-size: 0.9rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  overflow: hidden;          /* IMPORTANT — hides glow edges */
  transition: color .3s ease;
  backdrop-filter: blur(6px);
}

.btn-spotlight:hover {
  color: #fff;
}

.spotlight-beam {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease-out;

  /* BIGGER beam for smooth spread */
  background:
    radial-gradient(
      circle at var(--x, 50%) var(--y, 50%),
      rgba(120,255,120,0.25) 0%,
      rgba(80,255,80,0.10) 20%,
      rgba(0,0,0,0.0) 55%
    );
}

.btn-spotlight:hover .spotlight-beam {
  opacity: 1;
}
</style>

<div class="btn-wrapper" style="max-width:260px;">


  <button class="btn-spotlight btn-size-2" id="spotBtn">
    <div class="spotlight-beam"></div>
    <span style="position:relative; pointer-events:none;">SPOTLIGHT FLOW</span>
  </button>
</div>

<script>
/* Mouse-tracking spotlight */
const spotBtn = document.getElementById("spotBtn");

spotBtn.addEventListener("mousemove", (e) => {
  const rect = spotBtn.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  spotBtn.style.setProperty("--x", `${x}px`);
  spotBtn.style.setProperty("--y", `${y}px`);
});
</script>
</div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
