<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Financing CTA Button with Icon</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="inline-flex gap-3 sm:h-14 sm:px-8 transition transform hover:scale-[1.02] hover:ring-2 hover:ring-white/20 text-white font-geist h-12 rounded-xl pr-6 pl-6 shadow-xl items-center" style="background: linear-gradient(135deg, #374151 0%, #4B5563 50%, #6B7280 100%); box-shadow: 0 12px 24px rgba(255, 255, 255, 0.12), inset 0 1px 0 rgba(255,255,255,0.08);">

            </span>
            <span class="text-sm sm:text-base font-semibold tracking-tight font-geist">Apply for Financing</span>
          </button></div><script>try{lucide.createIcons()}catch(e){}</script><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
