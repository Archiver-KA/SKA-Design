<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Call-to-Action Button with Hover Lift</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="text-lg" style="border: 1px solid black; padding: 12px 30px; border-radius: 30px; background-color: rgb(250, 112, 250); font-weight: bolder; font-size: 15px; box-shadow: 0px 0px 1px; transition-duration: 0.3s; cursor: pointer; outline: none; display: flex; align-items: center; justify-content: center; transform: translateY(0px);" onmouseover="this.style.transform='translateY(-10px)'; this.style.boxShadow='0px 7px 1px rgb(0, 0, 0)'" onmouseout="this.style.transform='translateY(0px)'; this.style.boxShadow='0px 0px 1px'" onmousedown="this.style.transform='translateY(10px)'; this.style.boxShadow='0px 0px 1px'" onmouseup="this.style.transform='translateY(-10px)'; this.style.boxShadow='0px 7px 1px rgb(0, 0, 0)'">View My Work</button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
