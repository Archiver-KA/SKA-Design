<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Hover Glow CTA Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="flex items-center justify-center min-h-screen bg-neutral-900">
  <div class="inline-block relative">
    <button
      class="relative text-white px-6 py-3 rounded-full text-base font-medium cursor-pointer focus:outline-none min-w-[180px] h-[48px] shadow-[0_2.8px_2.2px_rgba(0,0,0,0.3),_0_6.7px_5.3px_rgba(0,0,0,0.35),_0_12.5px_10px_rgba(0,0,0,0.4)] transition-all duration-500 ease-in-out hover:-translate-y-[3px]"
      style="background: linear-gradient(45deg, #3B82F6, #8B5CF6, #6D28D9);"
      type="button"
      aria-label="Generate My Code"
      title="Generate My Code"
    >
      <span
        class="transition-opacity duration-500 hover:opacity-70 bg-[#1E1E1E] rounded-full absolute top-[1px] right-[1px] bottom-[1px] left-[1px]"
        style="z-index: 0"
      ></span>
      <span
        class="absolute inset-0 rounded-full opacity-0 transition-opacity duration-500 hover:opacity-100 blur-[20px]"
        style="background: linear-gradient(45deg, #3B82F6, #8B5CF6, #6D28D9); z-index: -1;"
      ></span>
      <span class="flex items-center justify-center gap-2 z-10 relative">
        Generate My Code
      </span>
    </button>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
