<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modern CTA Section with Background Typography</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><section
  class="border-x flex flex-col overflow-hidden bg-[#050508] w-full border-white/10 pt-32 pb-32 relative items-center justify-center"
 
 >
  <div class="z-0 opacity-[0.15] absolute top-0 right-0 bottom-0 left-0"
   ><img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/ebb79511-26fb-462e-9c38-b1bef4ad3707_1600w.webp" alt="AI Workflow" class="w-full h-full object-cover mix-blend-luminosity grayscale">
    <div class="bg-gradient-to-b from-[#050508] via-transparent to-[#050508] absolute top-0 right-0 bottom-0 left-0"
     
     ></div>
  </div>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full text-center pointer-events-none select-none z-0"
   
   >
    <span class="text-[18vw] font-bold text-white/[0.03] tracking-tighter leading-none block">VISION</span>
  </div>
  <div class="reveal-up is-revealed relative z-10 max-w-2xl text-center px-4 mb-16"
   
    style="transition-delay: 0ms;">
    <h2 class="text-2xl md:text-3xl lg:text-4xl font-medium tracking-tight leading-tight"
     
     >We architect digital realities that transcend the screen.</h2>
  </div>
  <div class="reveal-up is-revealed w-full"
    style="transition-delay: 200ms;">
    <form class="relative z-10 w-full max-w-3xl mx-auto px-4 flex flex-col md:flex-row gap-4 items-end"
     
     >
      <div class="flex-1 w-full flex flex-col gap-2"
       >
        <label class="text-xs text-white/40 uppercase tracking-wider font-medium ml-1">Company name</label><input type="text" placeholder="COMPANY" class="w-full h-12 px-4 rounded-sm outline-none text-sm placeholder:text-white/20 transition-all focus:border-purple-500/50" style="background: rgb(8, 8, 12); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: rgba(0, 0, 0, 0.5) 0px 2px 4px inset, rgba(0, 0, 0, 0.8) 0px 1px 0px inset, rgba(255, 255, 255, 0.02) 0px 1px 0px;">
      </div>
      <div class="flex-1 w-full flex flex-col gap-2"
       >
        <label class="text-xs text-white/40 uppercase tracking-wider font-medium ml-1">Enter your work email</label><input type="email" placeholder="EMAIL ADDRESS" class="w-full h-12 px-4 rounded-sm outline-none text-sm placeholder:text-white/20 transition-all focus:border-purple-500/50" style="background: rgb(8, 8, 12); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: rgba(0, 0, 0, 0.5) 0px 2px 4px inset, rgba(0, 0, 0, 0.8) 0px 1px 0px inset, rgba(255, 255, 255, 0.02) 0px 1px 0px;">
      </div>
      <button type="submit" class="h-12 px-8 rounded-sm text-xs font-medium tracking-wider uppercase text-white hover:brightness-110 transition-all w-full md:w-auto relative group overflow-hidden" style="background: linear-gradient(rgb(91, 33, 182) 0%, rgb(59, 7, 100) 100%); border-width: 1px; border-style: solid; border-color: rgba(255, 255, 255, 0.2) rgba(255, 255, 255, 0.1) rgba(0, 0, 0, 0.8); box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 0px inset, rgba(0, 0, 0, 0.4) 0px 4px 10px;"><span class="relative z-10 drop-shadow-md">Get an Estimate</span><div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div></button>
    </form>
  </div>
</section></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
