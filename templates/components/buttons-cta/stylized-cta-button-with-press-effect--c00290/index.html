<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stylized CTA Button with Press Effect</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root">
<button class="appearance-button bg-indigo-500 border-transparent rounded-2xl box-border text-white cursor-pointer inline-block font-bold text-sm tracking-wide leading-5 m-0 outline-none overflow-visible py-3 px-4 text-center uppercase touch-manipulation transform-gpu transition-all duration-200 select-none align-middle whitespace-nowrap w-fit relative hover:brightness-110 active:border-t-4 active:border-b-0 active:bg-transparent" style="font-family: din-round, sans-serif; border-width: 0 0 4px; transform: translateZ(0);" role="button">
    <span class="absolute inset-0 bg-indigo-400 rounded-2xl -z-10" style="border-width: 0 0 4px; bottom: -4px; background-clip: padding-box;"></span>
    Start Now
</button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
