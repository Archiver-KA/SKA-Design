<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Jelly Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="spring-button">
    Sign Up
    <style>
        .spring-button {
            position: relative;
            width: 150px;
            height: 55px;
            border-radius: 45px;
            border: none;
            background-color: rgb(59, 130, 246);
            color: white;
            box-shadow: 0px 10px 10px rgb(147, 197, 253) inset,
                0px 5px 10px rgba(5, 5, 5, 0.212),
                0px -10px 10px rgb(37, 99, 235) inset;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    
        .spring-button::before {
            width: 70%;
            height: 2px;
            position: absolute;
            background-color: rgba(250, 250, 250, 0.678);
            content: "";
            filter: blur(1px);
            top: 7px;
            border-radius: 50%;
        }
    
        .spring-button::after {
            width: 70%;
            height: 2px;
            position: absolute;
            background-color: rgba(250, 250, 250, 0.137);
            content: "";
            filter: blur(1px);
            bottom: 7px;
            border-radius: 50%;
        }
    
        .spring-button:hover {
            animation: jello-horizontal 1.2s both ease-in-out;
        }
    
        @keyframes jello-horizontal {
            0% {
                transform: scale3d(1, 1, 1);
            }
    
            20% {
                transform: scale3d(1.15, 0.85, 1);
            }
    
            30% {
                transform: scale3d(0.9, 1.1, 1);
            }
    
            40% {
                transform: scale3d(1.08, 0.92, 1);
            }
    
            50% {
                transform: scale3d(0.95, 1.05, 1);
            }
    
            60% {
                transform: scale3d(1.03, 0.97, 1);
            }
    
            70% {
                transform: scale3d(0.98, 1.02, 1);
            }
    
            80% {
                transform: scale3d(1.01, 0.99, 1);
            }
    
            90% {
                transform: scale3d(0.99, 1.01, 1);
            }
    
            100% {
                transform: scale3d(1, 1, 1);
            }
        }
    </style>
</button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
