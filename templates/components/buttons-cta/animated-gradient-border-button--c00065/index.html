<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Gradient Border Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="inline-block">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .codepen-button{display:block;cursor:pointer;color:#fff;position:relative;text-decoration:none;font-weight:600;border-radius:100px;overflow:hidden;padding:2px;isolation:isolate}.codepen-button::before{content:"";position:absolute;inset:0;width:400%;height:100%;background:linear-gradient(115deg,#d1d1d1,#02367b,#a7bfde);background-size:25% 100%;animation:border-shift .75s linear infinite}@keyframes border-shift{to{transform:translateX(-25%)}}.codepen-button span{position:relative;display:block;padding:1rem 1.5rem;font-size:1.1rem;background:#02367b;border-radius:100px;height:100%}
  </style>
  <a href="#" class="codepen-button">
    <span>Request Access</span>
  </a>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
