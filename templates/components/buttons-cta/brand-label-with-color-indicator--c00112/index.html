<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Brand Label with Color Indicator</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="group inline-flex gap-2 transition-all cursor-pointer text-sm font-medium text-white tracking-tight opacity-100 border-transparent rounded-full relative gap-x-2 gap-y-2 items-center justify-center" style="padding: 8px 24px; background: linear-gradient(135deg, #1a1a1a, #2d2d2d); border: none; color: white; position: relative; cursor: pointer; font-weight: 600; transition-duration: 0.3s">
  <div class="absolute left-0 top-0 w-full h-full rounded-full pointer-events-none" style="left: -1px; top: -1px; border-radius: 9999px; background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff, #00ffff, #ffff00); background-size: 200%; width: calc(100% + 2px); height: calc(100% + 2px); z-index: -1; animation: iridescent 8s linear infinite;"></div>
  <div class="absolute left-0 top-0 w-full h-full rounded-full pointer-events-none" style="left: -1px; top: -1px; border-radius: 9999px; background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff, #00ffff, #ffff00); background-size: 200%; width: calc(100% + 2px); height: calc(100% + 2px); z-index: -1; animation: iridescent 8s linear infinite; filter: blur(20px); opacity: 0.6;"></div>
  <span class="font-geist z-30 mx-1 my-1 relative">Start Free</span>
  <style>
    @keyframes iridescent {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
