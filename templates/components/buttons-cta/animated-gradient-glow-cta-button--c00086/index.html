<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Gradient Glow CTA Button</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="relative inline-block">
    <!-- Dependency Loader -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <div class="relative group cursor-pointer">
        <!-- Animated Glow Effect -->
        <div class="absolute -inset-1 bg-gradient-to-r from-orange-500 via-amber-400 to-red-500 rounded-full blur-xl opacity-60 group-hover:opacity-100 transition duration-500"
            style="will-change: opacity, filter;">
        </div>

        <!-- Main Button Surface -->
        <div
            class="relative bg-gradient-to-b from-white to-[#e5e5e5] text-black px-8 py-3.5 rounded-full flex items-center gap-2 shadow-[0_0_0_1px_rgba(255,255,255,0.5)] active:scale-95 transition-transform duration-200">

            <span class="text-sm font-semibold tracking-wide uppercase">
                Launch Workspace
            </span>

            <!-- Icon with Hover Translation -->
            <iconify-icon icon="solar:arrow-right-linear" width="18"
                class="transition-transform duration-300 group-hover:translate-x-1">
            </iconify-icon>
        </div>
    </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
