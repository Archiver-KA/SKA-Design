<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive CTA Section with Dual Buttons</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><section class="lg:px-8 lg:py-24">
      <div class="mx-auto max-w-4xl text-center">
        <h2 class="text-3xl text-neutral-900 sm:text-4xl lg:text-5xl font-geist tracking-tighter" style="">
          Ready to automate your releases?
        </h2>
        <p class="mx-auto mt-6 max-w-2xl text-lg text-neutral-600 font-geist">
          Join thousands of teams who ship faster and learn quicker with Aventra.
        </p>
        <div class="mt-10 flex items-center justify-center gap-4">
          <button class="flex items-center gap-2 rounded-lg bg-neutral-900 px-8 py-4 text-lg font-semibold text-white shadow-lg transition hover:bg-neutral-800 hover:shadow-xl font-geist">
            
            Start Free Trial
          </button>
          <button class="text-lg font-semibold text-neutral-600 transition hover:text-neutral-900 font-geist">
            Talk to Sales →
          </button>
        </div>
      </div>
    </section></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
