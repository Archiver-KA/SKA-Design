<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Pill Button with Icon</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root">

<button class="group hover:from-indigo-500/50 hover:to-purple-500/50 transition-all duration-300 bg-gradient-to-b from-white/20 to-white/0 rounded-full pt-[1px] pr-[1px] pb-[1px] pl-[1px] relative gap-x-3 gap-y-3">
             <div class="flex gap-3 z-10 hover:bg-[#161616] transition-colors bg-[#111] rounded-full pt-3 pr-6 pb-3 pl-4 relative gap-x-3 gap-y-3 items-center">
                 <div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-white">
                      <iconify-icon icon="solar:play-bold-duotone" width="16" height="16"></iconify-icon>
                 </div>
                 <span class="text-sm font-semibold text-white">See the Benchmark</span>
             </div>
          </button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
