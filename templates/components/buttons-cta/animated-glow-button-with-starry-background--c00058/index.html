<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Glow Button with Starry Background</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="group inline-flex overflow-hidden transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] text-xl font-medium text-white tracking-tight bg-black ring-white/20 ring-1 rounded-full pt-4 pr-10 pb-4 pl-10 relative items-center justify-center font-manrope">
              <style>
                @keyframes move-star {
                0% { transform: translate(0, 0); opacity: 0; }
                50% { opacity: 1; }
                100% { transform: translate(var(--x), var(--y)); opacity: 0; }
                }
                .animate-star {
                animation: move-star var(--duration) ease-in-out infinite;
                animation-delay: var(--delay);
                }
              </style>
              <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
                <div class="animate-star absolute top-1/2 left-1/2 h-1 w-1 rounded-full bg-white blur-[0.5px]" style="--x: -40px; --y: -20px; --duration: 4s; --delay: 0s;"></div>
                <div class="animate-star absolute top-1/2 left-[40%] h-[1.5px] w-[1.5px] rounded-full bg-blue-200" style="--x: 30px; --y: -30px; --duration: 5s; --delay: 1s;"></div>
                <div class="absolute top-[20%] left-[70%] h-1 w-1 rounded-full bg-indigo-400 blur-[0.5px]" style="animation: move-star 3s ease-in-out infinite; --x: -20px; --y: 30px; --duration: 3.5s; --delay: 0.2s;"></div>
                <div class="absolute top-1/2 left-1/2 h-1.5 w-1.5 rounded-full bg-white/40 blur-sm animate-pulse" style="animation-duration: 2s;"></div>
              </div>
              <div class="absolute -top-12 left-1/2 h-24 w-[90%] -translate-x-1/2 rounded-full bg-blue-600/25 blur-[32px] transition-all duration-500 group-hover:bg-blue-500/45"></div>
              <div class="-bottom-12 -left-4 blur-[32px] transition-all duration-500 group-hover:bg-orange-400/30 bg-orange-500/15 w-[70%] h-24 rounded-full absolute"></div>
              <span class="relative z-10 opacity-90 transition-all duration-300 group-hover:opacity-100 group-hover:tracking-wider">
                Deploy Your Agents
              </span>
            </button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
