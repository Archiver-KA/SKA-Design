<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Border CTA Button with Icon</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button type="submit" class="relative gradient-border-button w-fit sm:w-auto">
    <div class="inline-flex gap-2 hover:shadow-xl transition-all duration-200 text-base font-medium text-white font-geist rounded-2xl pt-4 pr-8 pb-4 pl-8 shadow-lg items-center justify-center" style="box-shadow: inset 0 -2px 25px -4px rgba(255, 255, 255, 0.3);">
        <span class="font-geist">Start Learning</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4" style="stroke-width: 1.5;"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </div>
    <style>
        .gradient-border-button {
            position: relative;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ea580c);
            border-radius: 20px;
            padding: 2px;
        }
        .gradient-border-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #f97316);
            border-radius: 20px;
            padding: 1px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: exclude;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
        }
        .button-inner {
            position: relative;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ea580c);
            border-radius: 1rem;
            z-index: 1;
        }
    </style>
</button></div><script>try{lucide.createIcons()}catch(e){}</script><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
