<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stylized CTA Button with Hover Offset Border</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button type="button" role="button" style="touch-action: manipulation;" class="group relative w-full cursor-pointer select-none md:text-xl leading-7 flex md:px-12 transition-all duration-200 ease-out focus:outline-none hover:brightness-95 active:brightness-90 text-base font-bold text-black bg-blue-300 border-0 pt-3 pr-[1.65rem] pb-3 pl-[1.65rem] rotate-[-2deg] items-center justify-center max-w-xs">
        <span class="relative z-10">Sign Up</span>

        <!-- Offset border effect (replaces :after) -->
        <span aria-hidden="true" class="pointer-events-none absolute border border-black bottom-1 left-1 w-[calc(100%-1px)] h-[calc(100%-1px)] transition-all duration-200 ease-out group-hover:bottom-0.5 group-hover:left-0.5"></span>
      </button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
