<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact CTA Section with Feature Highlights</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="lg:col-span-7">

            </p>

            <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div class="flex items-start gap-3">

                </div>
                <div class="">
                  <p class="text-black font-semibold text-sm font-geist">Quick response</p>
                  <p class="text-black/70 text-xs font-geist">Most messages receive a reply in under 24h.</p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <div class="h-9 w-9 rounded-lg bg-black/5 backdrop-blur ring-1 ring-black/10 flex items-center justify-center text-black/90">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="route" class="lucide lucide-route h-4 w-4"><circle cx="6" cy="19" r="3" class=""></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" class=""></path><circle cx="18" cy="5" r="3" class=""></circle></svg>
                </div>
                <div class="">
                  <p class="text-black font-semibold text-sm font-geist">Clear next steps</p>

                </div>
              </div>
            </div>
          </div></div><script>try{lucide.createIcons()}catch(e){}</script><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
