<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Pill Button with Hover Animation</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><button class="group inline-flex overflow-hidden transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] cursor-pointer rounded-full px-[1px] py-[1px] relative shadow-[0_15px_30px_-10px_rgba(0,0,0,0.8)] items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-b from-slate-500 via-slate-800 to-slate-900 rounded-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
        <div class="flex overflow-hidden bg-[#0B1120] w-full h-full border-white/5 border rounded-full pt-4 pr-10 pb-4 pl-10 relative items-center justify-center">
          <span class="relative z-10 text-xl font-medium text-white tracking-tight font-manrope opacity-90 transition-all duration-300 group-hover:tracking-widest">Deploy Your Agents</span>
        </div>
      </button></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
