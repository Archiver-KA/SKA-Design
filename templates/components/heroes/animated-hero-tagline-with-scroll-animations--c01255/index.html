<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Hero Tagline with Scroll Animations</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="animate-on-scroll animate text-center blur-slide">
  <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-4">
    <span class="animate-on-scroll slide-left stagger-1 text-3xl sm:text-4xl md:text-5xl tracking-tight font-semibold italic font-playfair text-neutral-900 dark:text-white animate">Refresh your skin,</span>
    <img src="https://images.unsplash.com/photo-1611558709798-e009c8fd7706?auto=format&fit=crop&crop=faces&w=400&h=400&q=80" alt="Model applying serum" class="animate-on-scroll rotate-in stagger-2 inline-block sm:h-12 sm:w-12 md:h-14 md:w-14 bg-white w-10 h-10 object-cover ring-white ring-4 rounded-2xl shadow-xl -rotate-6 animate" style="">
    <span class="animate-on-scroll slide-right stagger-3 text-3xl sm:text-4xl md:text-5xl tracking-tight font-semibold italic font-playfair text-neutral-900 dark:text-white animate">love yourself,</span>
    <img src="https://images.unsplash.com/photo-1599817878414-43ef36677cf0?auto=format&fit=crop&w=2000&q=80" alt="Spa mask moment" class="animate-on-scroll rotate-in stagger-4 inline-block sm:h-12 sm:w-12 md:h-14 md:w-14 ring-white ring-4 bg-white w-10 h-10 object-cover rounded-2xl shadow-xl rotate-6 animate" style="">
  </div>
  <div class="flex flex-wrap gap-3 sm:gap-4 mt-2 items-center justify-center">
    <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=2000&q=80" alt="Leaf detail" class="animate-on-scroll scale-up stagger-5 inline-block sm:h-12 sm:w-20 md:h-14 md:w-24 ring-white ring-4 w-0 h-0 object-cover rounded-2xl shadow-xl -rotate-3 animate" style="">
    <span class="animate-on-scroll slide-up stagger-6 text-3xl sm:text-4xl md:text-5xl tracking-tight font-semibold italic font-playfair text-neutral-900 dark:text-white animate">renew your glow.</span>
  </div>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
