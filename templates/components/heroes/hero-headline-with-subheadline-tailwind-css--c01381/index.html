<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hero Headline with Subheadline (Tailwind CSS)</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="max-w-md flex flex-col gap-4">
                    <h3 class="leading-tight md:text-8xl text-7xl text-black mb-1 font-geist font-medium tracking-tighter" style="">FlowAI</h3>
                    <p class="md:text-5xl text-3xl font-normal text-black/50 tracking-tighter font-geist" style="">Intelligent workflows that adapt, learn, and optimize your business processes automatically.</p>
                </div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
