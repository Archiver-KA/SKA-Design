<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Testimonial Hero Section with Floating Images</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><section class="relative overflow-hidden sm:px-8 md:px-12 bg-neutral-900 rounded-3xl mt-8 pr-4 pl-4">
  <!-- Decorative photos around headline -->
  <div class="pointer-events-none absolute inset-0 p-4 sm:p-8 md:p-12">
    <div class="absolute left-4 sm:left-8 top-6 sm:top-10 -rotate-6">
      <img src="https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=800&q=80" alt="Art print in soft light" class="w-40 sm:w-52 md:w-64 rounded-2xl object-cover shadow-sm ring-1 ring-white/10">
    </div>
    <div class="absolute right-4 sm:right-8 top-8 sm:top-14 rotate-6">
      <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80" alt="Smiling client portrait" class="w-40 sm:w-52 md:w-64 rounded-2xl object-cover shadow-sm ring-1 ring-white/10">
    </div>
    <div class="absolute left-6 sm:left-10 bottom-6 sm:bottom-10 -rotate-12">
      <img src="https://images.unsplash.com/photo-1618244972963-dbee1a7edc95?auto=format&fit=crop&w=800&q=80" alt="Editorial fashion blur" class="w-44 sm:w-60 md:w-72 rounded-2xl object-cover shadow-sm ring-1 ring-white/10">
    </div>
    <div class="absolute right-6 sm:right-12 bottom-4 sm:bottom-8 rotate-6">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Minimal architecture scene" class="w-40 sm:w-52 md:w-64 rounded-2xl object-cover shadow-sm ring-1 ring-white/10">
    </div>
  </div>

  <!-- Content -->
  <div class="relative max-w-5xl sm:px-8 sm:pt-24 sm:pb-24 text-center mr-auto ml-auto pt-20 pr-4 pb-20 pl-4">
    <!-- Header positioned at top left and right -->
    <div class="absolute left-0 right-0 top-6 px-6">


    </div>

    <h2 class="sm:text-4xl md:text-6xl leading-tight text-3xl font-light text-white tracking-tight">
      Clients say working with Suzy Liu blends thoughtful direction and meticulous light—helping brands grow with
      confidence.
    </h2>

    <a href="#"
      class="mt-8 inline-flex items-center gap-2 rounded-full px-5 py-3 text-sm font-medium bg-white text-neutral-900 hover:bg-neutral-100 transition">
      Read all reviews
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
        data-lucide="arrow-up-right" class="lucide lucide-arrow-up-right h-4 w-4">
        <path d="M7 7h10v10" class=""></path>
        <path d="M7 17 17 7" class=""></path>
      </svg>
    </a>
  </div>
</section></div><script>try{lucide.createIcons()}catch(e){}</script><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
