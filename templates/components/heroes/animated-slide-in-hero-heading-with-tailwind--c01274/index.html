<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Slide-In Hero Heading with Tailwind</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><h1 class="leading-none tracking-tight text-white select-none">
  <span id="sinera-eme99d4vq" class="block text-[22vw] md:text-[16vw] xl:text-[12vw] 2xl:text-[10vw] font-extrabold" style="overflow: hidden;">
  <span style="display: inline-block; animation: letterSlideIn 0.8s ease-out forwards; animation-delay: 0s; transform: translateY(-100%); opacity: 0; clip-path: inset(0 0 100% 0);">K</span><span style="display: inline-block; animation: letterSlideIn 0.8s ease-out forwards; animation-delay: 0.1s; transform: translateY(-100%); opacity: 0; clip-path: inset(0 0 100% 0);">Y</span><span style="display: inline-block; animation: letterSlideIn 0.8s ease-out forwards; animation-delay: 0.2s; transform: translateY(-100%); opacity: 0; clip-path: inset(0 0 100% 0);">R</span><span style="display: inline-block; animation: letterSlideIn 0.8s ease-out forwards; animation-delay: 0.3s; transform: translateY(-100%); opacity: 0; clip-path: inset(0 0 100% 0);">O</span>
  <style>
    @keyframes letterSlideIn {
      0% {
        transform: translateY(-100%);
        opacity: 0;
        clip-path: inset(0 0 100% 0);
      }

      50% {
        opacity: 0.5;
        clip-path: inset(0 0 50% 0);
      }

      100% {
        transform: translateY(0);
        opacity: 1;
        clip-path: inset(0 0 0% 0);
      }
    }
  </style>
  </span>
</h1></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
