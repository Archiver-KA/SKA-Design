<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hero Section with Gradient Background</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root" style="position:relative;min-height:100vh"><div class="w-full">
  <style>.hero-section-dark {
      min-height: 90vh;
      padding: 120px 24px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .hero-section-dark h1 {
      margin: 0 0 12px;
      letter-spacing: -0.02em;
      font-size: 3.5rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.1;
    }
    .hero-section-dark p {
      margin: 0;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      max-width: 70ch;
      font-size: 1.125rem;
    }
    @media (max-width: 768px) {
      .hero-section-dark {
        padding: 80px 24px 40px;
        min-height: 70vh;
      }
      .hero-section-dark h1 {
        font-size: 2.5rem;
      }
      .hero-section-dark p {
        font-size: 1rem;
      }
    }</style>
  <section id="features" class="hero-section-dark">
    <h1>Welcome to the Future</h1>
    <p>Discover innovative solutions that transform the way you work. Our platform combines cutting-edge technology with intuitive design to deliver exceptional results.</p>
  </section>
</div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
