<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animated Shimmer Headline Text Effect</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><!-- Füge das in deinen <head> oder vor dem </body> ein -->
<style>
  @keyframes shimmer {
    0%, 100% { background-position: 200% 0; }
    50% { background-position: 0% 0; }
  }
  
  .headline-shimmer {
    background: linear-gradient(90deg, #F1F5F9 0%, #F1F5F9 40%, #14B8A6 50%, #F1F5F9 60%, #F1F5F9 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease-in-out infinite;
  }
</style>

<!-- Deine Headline -->
<h1 class="lg:text-[76px] text-5xl font-bold leading-[1.05] tracking-tight font-custom mb-6 headline-shimmer">
  Stop Guessing.<br>
  Start Knowing.
</h1></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
