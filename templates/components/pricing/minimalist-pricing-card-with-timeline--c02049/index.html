<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minimalist Pricing Card with Timeline</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="ring-1 ring-white/10 flex flex-col bg-black/30 rounded-2xl pt-5 pr-5 pb-5 pl-5">
              <div class="flex-1">
                <div class="flex items-end gap-2">
                  <div class="text-5xl sm:text-6xl lg:text-7xl font-semibold tracking-tighter tabular-nums font-geist" data-amount="">$3,200</div>
                  <div class="pb-2 text-white/60 text-base font-geist" data-period="">/project</div>
                </div>
              </div>
              <div class="mt-8 pt-4 border-t border-white/10 text-xs text-white/70 flex items-center justify-between font-geist">
                <span data-delivery-key="">Timeline</span>
                <span data-delivery-val="">4–6 weeks</span>
              </div>
            </div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
