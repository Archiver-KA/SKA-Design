<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pricing Mode Toggle Button Group</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:#ffffff;color:#0a0a0a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}</style></head><body><div id="component-root"><div class="inline-flex gap-1 ring-1 ring-white/10 bg-white/10 rounded-full mt-5 pt-1 pr-1 pb-1 pl-1 items-center">
          <button type="button" data-mode-button="project" class="text-sm text-gray-900 tracking-tight font-geist bg-white rounded-full pt-1.5 pr-3 pb-1.5 pl-3">Fixed price</button>
          <button type="button" data-mode-button="monthly" class="text-sm tracking-tight font-geist rounded-full pt-1.5 pr-3 pb-1.5 pl-3 text-white/80">Retainer</button>
        </div></div><script>try{var r=document.getElementById("component-root");if(r.children.length===1){var d=getComputedStyle(r.children[0]).display;if(d.indexOf("inline")===0)r.style.textAlign="center"}}catch(e){}</script></body></html>
