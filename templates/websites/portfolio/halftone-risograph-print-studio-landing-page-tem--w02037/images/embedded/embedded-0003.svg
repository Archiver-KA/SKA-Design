<svg viewBox="0 0 640 460" fill="none" role="img" aria-label="Blueprint line drawing of Rosie, the risograph duplicator">
          <!-- stand -->
          <rect x="120" y="380" width="16" height="58" rx="3" stroke="#201c30" stroke-width="2"></rect>
          <rect x="504" y="380" width="16" height="58" rx="3" stroke="#201c30" stroke-width="2"></rect>
          <line x1="100" y1="440" x2="156" y2="440" stroke="#201c30" stroke-width="2"></line>
          <line x1="484" y1="440" x2="540" y2="440" stroke="#201c30" stroke-width="2"></line>
          <!-- body -->
          <rect x="70" y="200" width="500" height="180" rx="14" stroke="#201c30" stroke-width="2.5"></rect>
          <!-- lid -->
          <rect x="92" y="158" width="280" height="42" rx="8" stroke="#201c30" stroke-width="2"></rect>
          <rect x="206" y="146" width="52" height="12" rx="4" stroke="#201c30" stroke-width="2"></rect>
          <!-- drum -->
          <circle cx="300" cy="290" r="62" stroke="#ff48b0" stroke-width="2.5"></circle>
          <circle cx="300" cy="290" r="38" stroke="#ff48b0" stroke-width="1.5" stroke-dasharray="5 6"></circle>
          <circle cx="300" cy="290" r="5" fill="#ff48b0"></circle>
          <line x1="262" y1="252" x2="338" y2="328" stroke="#ff48b0" stroke-width="1.2" opacity=".5"></line>
          <line x1="262" y1="328" x2="338" y2="252" stroke="#ff48b0" stroke-width="1.2" opacity=".5"></line>
          <!-- control panel -->
          <rect x="440" y="216" width="106" height="54" rx="8" stroke="#201c30" stroke-width="2"></rect>
          <rect x="452" y="226" width="38" height="20" rx="3" stroke="#201c30" stroke-width="1.5"></rect>
          <circle cx="506" cy="236" r="5" stroke="#201c30" stroke-width="1.5"></circle>
          <circle cx="524" cy="236" r="5" stroke="#201c30" stroke-width="1.5"></circle>
          <circle cx="506" cy="256" r="5" stroke="#201c30" stroke-width="1.5"></circle>
          <circle cx="524" cy="256" r="5" fill="#ff48b0"></circle>
          <!-- feed tray -->
          <polygon points="18,232 70,216 70,262 26,274" stroke="#201c30" stroke-width="2"></polygon>
          <line x1="28" y1="238" x2="64" y2="227" stroke="#201c30" stroke-width="1.2"></line>
          <line x1="30" y1="248" x2="64" y2="238" stroke="#201c30" stroke-width="1.2"></line>
          <!-- output tray + flying sheet -->
          <polygon points="570,298 626,284 626,332 570,338" stroke="#201c30" stroke-width="2"></polygon>
          <rect x="576" y="246" width="48" height="32" rx="3" stroke="#ff48b0" stroke-width="2" stroke-dasharray="4 5" transform="rotate(-9 600 262)"></rect>
          <line x1="548" y1="252" x2="566" y2="250" stroke="#ff48b0" stroke-width="1.5"></line>
          <line x1="546" y1="262" x2="564" y2="260" stroke="#ff48b0" stroke-width="1.5"></line>
          <!-- label -->
          <text x="96" y="360" font-family="Manrope, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#201c30">MZ-790 “ROSIE”</text>
          <!-- hotspots -->
          <g font-family="Manrope, sans-serif" font-size="12.5" font-weight="800">
            <circle cx="44" cy="198" r="14" fill="#fbf7ee" stroke="#765ba7" stroke-width="1.5"></circle>
            <text x="44" y="202.5" text-anchor="middle" fill="#765ba7">1</text>
            <circle cx="300" cy="212" r="14" fill="#fbf7ee" stroke="#765ba7" stroke-width="1.5"></circle>
            <text x="300" y="216.5" text-anchor="middle" fill="#765ba7">2</text>
            <circle cx="493" cy="196" r="14" fill="#fbf7ee" stroke="#765ba7" stroke-width="1.5"></circle>
            <text x="493" y="200.5" text-anchor="middle" fill="#765ba7">3</text>
            <circle cx="600" cy="360" r="14" fill="#fbf7ee" stroke="#765ba7" stroke-width="1.5"></circle>
            <text x="600" y="364.5" text-anchor="middle" fill="#765ba7">4</text>
          </g>
        </svg>