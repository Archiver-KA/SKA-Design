        <path d="M 100,0 C 400,400 900,300 800,800 C 700,1300 100,1500 200,2000 C 300,2500 900,2800 500,3000" fill="none" stroke="url(#noodle-beam)" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-dasharray: 200 3000; animation: beam-flow-noodle 10s linear infinite;" />
