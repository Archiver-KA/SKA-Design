<svg class="w-full h-full" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="roadGradient" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#71717a;stop-opacity:0.3"></stop>
          <stop offset="50%" style="stop-color:#e4e4e7;stop-opacity:0.2"></stop>
          <stop offset="100%" style="stop-color:#000000;stop-opacity:0.0"></stop>
        </linearGradient>
      </defs>

      <!-- Main Flow Paths Reference -->
      <path id="pathMain" d="M 400 1000 C 600 900, 900 600, 1300 200" fill="none"></path>

      <!-- Noodles (Visible only on Desktop) -->
      <g class="hidden lg:block">
        <!-- Noodle 1: Left Vertical Track -->
        <rect x="580" y="600" width="120" height="400" rx="60" transform="rotate(-15 640 800)" fill="none" stroke="#3f3f46" stroke-width="0.5" opacity="0.3"></rect>
        <rect x="580" y="600" width="120" height="400" rx="60" transform="rotate(-15 640 800)" fill="none" stroke="#d4d4d8" stroke-width="1" stroke-linecap="round" class="animate-beam" opacity="0.5"></rect>

        <!-- Noodle 2: Center Right Track -->
        <rect x="880" y="300" width="140" height="450" rx="70" transform="rotate(-25 950 525)" fill="none" stroke="#3f3f46" stroke-width="0.5" opacity="0.3"></rect>
        <rect x="880" y="300" width="140" height="450" rx="70" transform="rotate(-25 950 525)" fill="none" stroke="#d4d4d8" stroke-width="1" stroke-linecap="round" class="animate-beam" opacity="0.5" style="animation-delay: -3s;"></rect>

        <!-- Noodle 3: Top Right Track -->
        <rect x="1050" y="50" width="100" height="300" rx="50" transform="rotate(-35 1100 200)" fill="none" stroke="#3f3f46" stroke-width="0.5" opacity="0.3"></rect>
        <rect x="1050" y="50" width="100" height="300" rx="50" transform="rotate(-35 1100 200)" fill="none" stroke="#d4d4d8" stroke-width="1" stroke-linecap="round" class="animate-beam" opacity="0.5" style="animation-delay: -6s;"></rect>
      </g>

      <!-- Background Roads -->
      <path d="M 600 1000 C 700 900, 800 700, 1300 550" fill="none" stroke="#1e293b" stroke-width="30" opacity="0.3" stroke-linecap="round"></path>
      <path d="M 900 1000 C 950 900, 900 700, 1300 450" fill="none" stroke="#1e293b" stroke-width="20" opacity="0.3" stroke-linecap="round"></path>

      <!-- Main Highway -->
      <path d="M 400 1000 C 600 900, 900 600, 1300 200" fill="none" stroke="url(#roadGradient)" stroke-width="50" opacity="0.8" stroke-linecap="butt"></path>
      <path d="M 400 1000 C 600 900, 900 600, 1300 200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="20 40" opacity="0.6"></path>

      <!-- Moving Data Packet (White/Silver for prestige) -->
      <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#ffffff" opacity="0.95" filter="drop-shadow(0 0 10px rgba(255,255,255,0.5))">
        <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
          <mpath href="#pathMain"></mpath>
        </animateMotion>
      </rect>
    </svg>