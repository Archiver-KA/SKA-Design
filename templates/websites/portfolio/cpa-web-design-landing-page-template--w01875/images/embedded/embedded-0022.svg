<svg class="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox="0 0 512 180">
                  <defs>
                    <linearGradient id="line-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color: #ffffff; stop-opacity: 0"></stop>
                        <stop offset="50%" style="stop-color: #ffffff; stop-opacity: 0.5"></stop>
                        <stop offset="100%" style="stop-color: #ffffff; stop-opacity: 0"></stop>
                    </linearGradient>
                  </defs>

                  <!-- Background Lines (Faint) -->
                  <path d="M 32 24 C 32 80, 256 40, 256 120" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1.5">
                  </path>
                  <path d="M 92 24 C 92 80, 256 40, 256 120" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1.5">
                  </path>
                  <path d="M 152 24 C 152 80, 256 40, 256 120" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1.5">
                  </path>
                  <path d="M 212 24 C 212 80, 256 40, 256 120" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1.5">
                  </path>
                  <path d="M 360 24 C 360 80, 256 40, 256 120" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1.5">
                  </path>
                  <path d="M 420 24 C 420 80, 256 40, 256 120" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1.5">
                  </path>


                  <!-- Animated Beam Lines -->
                  <path d="M 32 24 C 32 80, 256 40, 256 120" fill="none" stroke="url(#line-gradient)" stroke-width="1.5" class="animate-beam"></path>
                  <path d="M 92 24 C 92 80, 256 40, 256 120" fill="none" stroke="url(#line-gradient)" stroke-width="1.5" class="animate-beam" style="animation-delay: -1s;"></path>
                  <path d="M 152 24 C 152 80, 256 40, 256 120" fill="none" stroke="url(#line-gradient)" stroke-width="1.5" class="animate-beam" style="animation-delay: -2s;"></path>
                  <path d="M 212 24 C 212 80, 256 40, 256 120" fill="none" stroke="url(#line-gradient)" stroke-width="1.5" class="animate-beam" style="animation-delay: -3s;"></path>
                  <path d="M 360 24 C 360 80, 256 40, 256 120" fill="none" stroke="url(#line-gradient)" stroke-width="1.5" class="animate-beam" style="animation-delay: -1.5s;"></path>


                  <!-- Glowing Node at convergence -->
                  <circle cx="256" cy="120" r="3" fill="#ffffff" class="animate-pulse">
                    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"></animate>
                    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"></animate>
                  </circle>

                  <!-- Vertical Line Down -->
                  <line x1="256" y1="120" x2="256" y2="160" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"></line>
                </svg>