<svg class="w-full h-48 opacity-90" viewBox="0 0 800 200" preserveAspectRatio="none">
                                <!-- Amber Main Timbral Wave -->
                                <path id="amber-wave" d="M0,100" stroke="#FF7A1A" stroke-width="1.5" fill="none" class="transition-all duration-300"></path>
                                <!-- Cyan Subharmonic Wave -->
                                <path id="cyan-wave" d="M0,100" stroke="#7DF9FF" stroke-width="1" fill="none" stroke-dasharray="3 3" class="transition-all duration-300"></path>
                            </svg>