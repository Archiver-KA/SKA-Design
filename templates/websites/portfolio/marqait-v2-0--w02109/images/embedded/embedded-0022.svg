<svg class="absolute top-[48px] left-0 w-full h-[120px] z-0 pointer-events-none overflow-visible hidden md:block" preserveAspectRatio="none" viewBox="0 0 1200 120">
              <defs>
                <!-- Figma Gradient -->
                <linearGradient id="grad-left" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="200" y2="120">
                  <stop offset="0" stop-color="#3b82f6" stop-opacity="0"></stop>
                  <stop offset="0.5" stop-color="#a855f7"></stop>
                  <stop offset="1" stop-color="#0ACF83" stop-opacity="0"></stop>
                </linearGradient>

                <!-- Framer Gradient -->
                <linearGradient id="grad-center" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="600" y2="120">
                  <stop offset="0" stop-color="#f59e0b" stop-opacity="0"></stop>
                  <stop offset="0.5" stop-color="#f59e0b"></stop>
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
                </linearGradient>

                <!-- Dribbble Gradient -->
                <linearGradient id="grad-right" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="1000" y2="120">
                  <stop offset="0" stop-color="#ec4899" stop-opacity="0"></stop>
                  <stop offset="0.5" stop-color="#ec4899"></stop>
                  <stop offset="1" stop-color="#ea4c89" stop-opacity="0"></stop>
                </linearGradient>
              </defs>

              <!-- Background Tracks (Static) -->
              <path d="M 600 0 C 600 60, 200 60, 200 120" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"></path>
              <path d="M 600 0 L 600 120" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"></path>
              <path d="M 600 0 C 600 60, 1000 60, 1000 120" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"></path>

              <!-- Animated Flow Lines -->
              <!-- Left -->
              <path d="M 600 0 C 600 60, 200 60, 200 120" fill="none" stroke="url(#grad-left)" stroke-width="2" class="animate-flow-line" stroke-linecap="round"></path>
              <!-- Center -->
              <path d="M 600 0 L 600 120" fill="none" stroke="url(#grad-center)" stroke-width="2" class="animate-flow-line" stroke-linecap="round" style="animation-delay: 1s;"></path>
              <!-- Right -->
              <path d="M 600 0 C 600 60, 1000 60, 1000 120" fill="none" stroke="url(#grad-right)" stroke-width="2" class="animate-flow-line" stroke-linecap="round" style="animation-delay: 2s;"></path>
            </svg>