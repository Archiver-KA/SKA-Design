<svg class="absolute top-0 right-0 bottom-0 left-0 w-[364px] h-[422px]" viewBox="0 0 500 260" preserveAspectRatio="none" stroke-width="2" style="width: 364px; height: 422px; color: rgb(212, 212, 212);">
