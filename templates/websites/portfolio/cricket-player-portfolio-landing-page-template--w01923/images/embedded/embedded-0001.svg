<svg viewBox="0 0 200 200" class="w-full h-full opacity-80" id="wagonWheel">
                        <!-- Field Circle -->
                        <circle cx="100" cy="100" r="98" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
                        <circle cx="100" cy="100" r="30" fill="#111" stroke="#333" stroke-width="1"/>
                        
                        <!-- Pitch -->
                        <rect x="95" y="80" width="10" height="40" fill="#222" />

                        <!-- Scoring Zones (Animated Lines) -->
                        <!-- Off Side -->
                        <path d="M100 100 L180 60" stroke="#10b981" stroke-width="2" stroke-linecap="round" class="score-line" />
                        <path d="M100 100 L170 120" stroke="#10b981" stroke-width="3" stroke-linecap="round" class="score-line" />
                        <path d="M100 100 L150 160" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" class="score-line" />
                        
                        <!-- Leg Side -->
                        <path d="M100 100 L40 140" stroke="#10b981" stroke-width="2" stroke-linecap="round" class="score-line" />
                        <path d="M100 100 L20 80" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" class="score-line" />
                        
                        <!-- V -->
                        <path d="M100 100 L95 180" stroke="#059669" stroke-width="4" stroke-linecap="round" class="score-line" />
                        <path d="M100 100 L105 180" stroke="#059669" stroke-width="4" stroke-linecap="round" class="score-line" />
                    </svg>