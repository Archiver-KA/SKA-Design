<svg 
          viewBox="0 0 1000 300" 
          class="w-full h-auto"
          preserveAspectRatio="xMidYMid meet"
        >
          <!-- Grid lines -->
          <g class="opacity-20">
            <line x1="0" y1="150" x2="1000" y2="150" stroke="white" stroke-width="1" />
            <line x1="100" y1="0" x2="100" y2="300" stroke="white" stroke-width="1" />
            <line x1="300" y1="0" x2="300" y2="300" stroke="white" stroke-width="1" />
            <line x1="500" y1="0" x2="500" y2="300" stroke="white" stroke-width="1" />
            <line x1="700" y1="0" x2="700" y2="300" stroke="white" stroke-width="1" />
            <line x1="900" y1="0" x2="900" y2="300" stroke="white" stroke-width="1" />
          </g>
          
          <!-- Animated sinusoidal wave using Bézier curves -->
          <path 
            d="M 50,150 
               C 125,50 175,250 250,150 
               S 375,50 450,150 
               S 575,250 650,150 
               S 775,50 850,150 
               S 975,250 950,150"
            fill="none" 
            stroke="rgb(56, 189, 248)" 
            stroke-width="4"
            stroke-linecap="round"
            class="wave-path"
          />
          
          <!-- Highlight points -->
          <circle cx="50" cy="150" r="4" fill="rgb(236, 72, 153)" />
          <circle cx="250" cy="150" r="4" fill="rgb(236, 72, 153)" />
          <circle cx="450" cy="150" r="4" fill="rgb(236, 72, 153)" />
          <circle cx="650" cy="150" r="4" fill="rgb(236, 72, 153)" />
          <circle cx="850" cy="150" r="4" fill="rgb(236, 72, 153)" />
          <circle cx="950" cy="150" r="4" fill="rgb(236, 72, 153)" />
        </svg>