<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0)"></stop>
                            <stop offset="20%" stop-color="rgba(255,255,255,0.2)"></stop>
                            <stop offset="100%" stop-color="#C09C6E"></stop>
                        </linearGradient>
                    </defs>
                    
                    <!-- Line to Java (Left Cluster) -->
                    <path d="M220 200 L 220 260 L 300 300" stroke="url(#lineGradient)" stroke-width="1" stroke-dasharray="2 4" fill="none" class="opacity-50"></path>
                    <circle cx="300" cy="300" r="3" fill="#C09C6E" class="animate-pulse"></circle>
                    
                    <!-- Line to Bali (Center Cluster) -->
                    <path d="M500 180 L 500 280 L 480 310" stroke="url(#lineGradient)" stroke-width="1" stroke-dasharray="2 4" fill="none" class="opacity-50"></path>
                    <circle cx="480" cy="310" r="3" fill="#C09C6E" class="animate-pulse"></circle>

                    <!-- Line to Komodo (Right Cluster) -->
                    <path d="M780 200 L 780 260 L 550 315" stroke="url(#lineGradient)" stroke-width="1" stroke-dasharray="2 4" fill="none" class="opacity-50"></path>
                    <circle cx="550" cy="315" r="3" fill="#C09C6E" class="animate-pulse"></circle>
                </svg>