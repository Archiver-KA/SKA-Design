<svg id="routeMap" viewBox="0 0 800 560" role="img" aria-label="Route chart from Port Sable to Kairo, a thirty-six hour passage south">
                <defs><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="currentColor" stroke-opacity="0.12"></path></pattern></defs>
                <rect width="800" height="560" fill="url(#grid)"></rect>
                <g class="map__lat" font-size="10" letter-spacing="0.2em" fill="currentColor" fill-opacity="0.55">
                  <text x="14" y="76">58° S</text><text x="14" y="236">60° S</text><text x="14" y="396">62° S</text>
                  <text x="240" y="548">146° W</text><text x="560" y="548">148° W</text>
                </g>
                <path id="routePath" class="map__route" d="M118 118 C 260 150, 330 300, 470 350 S 640 380, 662 418" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                <path class="map__route-ghost" d="M118 118 C 260 150, 330 300, 470 350 S 640 380, 662 418" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 6"></path>
                <g class="map__port"><circle cx="118" cy="118" r="4" fill="currentColor"></circle><circle cx="118" cy="118" r="12" fill="none" stroke="currentColor" stroke-opacity="0.4"></circle><text x="140" y="112" font-size="11" letter-spacing="0.28em" fill="currentColor">PORT SABLE</text><text x="140" y="128" font-size="10" fill="currentColor" fill-opacity="0.55">Depart Fridays, dusk</text></g>
                <g class="map__island"><path d="M650 418 l12 -16 l6 8 l4 -4 l10 12 z" fill="currentColor"></path><circle cx="662" cy="418" r="22" fill="none" stroke="currentColor" stroke-opacity="0.35"></circle><text x="620" y="466" font-size="11" letter-spacing="0.28em" fill="currentColor">KAIRO</text><text x="620" y="482" font-size="10" fill="currentColor" fill-opacity="0.55">61° 24′ S · 148° 07′ W</text></g>
                <g id="vessel" class="map__vessel"><circle r="5" fill="currentColor"></circle><circle r="11" fill="none" stroke="currentColor" stroke-opacity="0.5"></circle></g>
                <text id="routeLabel" class="map__label" x="400" y="300" font-size="10" letter-spacing="0.28em" fill="currentColor" fill-opacity="0.7">36 H · 410 NM</text>
              </svg>