<svg class="w-full h-full absolute inset-0 text-[#F4F4F1]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
                            <!-- Grid -->
                            <defs>
                                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="0.5"></path>
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#grid)"></rect>
                            
                            <!-- Connecting Lines -->
                            <g stroke="#FF4D00" stroke-width="1.5" fill="none">
                                <path class="blueprint-path" d="M 50 150 L 120 150 L 120 80 L 200 80"></path>
                                <path class="blueprint-path" style="animation-delay: 0.5s" d="M 50 150 L 120 150 L 120 220 L 200 220"></path>
                                <path class="blueprint-path" style="animation-delay: 1s" d="M 260 80 L 320 80 L 320 150 L 350 150"></path>
                                <path class="blueprint-path" style="animation-delay: 1.2s" d="M 260 220 L 320 220 L 320 150"></path>
                            </g>
                            
                            <!-- Nodes -->
                            <g fill="#151515" stroke="#F4F4F1" stroke-width="2">
                                <rect x="30" y="130" width="40" height="40"></rect>
                                <circle cx="230" cy="80" r="30"></circle>
                                <circle cx="230" cy="220" r="30"></circle>
                                <rect x="340" y="130" width="40" height="40" fill="#FF4D00" stroke="none"></rect>
                            </g>
                        </svg>