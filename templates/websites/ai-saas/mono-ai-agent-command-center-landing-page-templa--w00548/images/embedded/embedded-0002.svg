<svg class="w-full h-full" viewBox="0 0 200 200">
                            <defs>
                                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-width="0.5" class="text-white/20"></path>
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#grid)"></rect>
                            <circle cx="100" cy="100" r="40" fill="none" stroke="currentColor" stroke-width="1" class="text-blue-500/50"></circle>
                            <circle cx="150" cy="50" r="20" fill="none" stroke="currentColor" stroke-width="1" class="text-purple-500/50"></circle>
                            <line x1="100" y1="100" x2="150" y2="50" stroke="currentColor" stroke-width="1" class="text-white/20"></line>
                        </svg>