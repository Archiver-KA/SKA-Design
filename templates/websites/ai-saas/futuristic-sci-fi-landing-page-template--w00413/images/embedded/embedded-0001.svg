<svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
                <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(96,165,250,0.05)" stroke-width="0.5"></path>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"></rect>
        
        <!-- Main grid lines -->
        <line x1="0" y1="25%" x2="100%" y2="25%" class="grid-line" style="animation-delay: 1s"></line>
        <line x1="0" y1="75%" x2="100%" y2="75%" class="grid-line" style="animation-delay: 1.5s"></line>
        <line x1="25%" y1="0" x2="25%" y2="100%" class="grid-line" style="animation-delay: 2s"></line>
        <line x1="75%" y1="0" x2="75%" y2="100%" class="grid-line" style="animation-delay: 2.5s"></line>
        
        <!-- Corner dots -->
        <circle cx="25%" cy="25%" r="3" class="corner-dot" style="animation-delay: 3s"></circle>
        <circle cx="75%" cy="25%" r="3" class="corner-dot" style="animation-delay: 3.2s"></circle>
        <circle cx="25%" cy="75%" r="3" class="corner-dot" style="animation-delay: 3.4s"></circle>
        <circle cx="75%" cy="75%" r="3" class="corner-dot" style="animation-delay: 3.6s"></circle>
        <circle cx="50%" cy="50%" r="2" class="corner-dot" style="animation-delay: 4s"></circle>
    </svg>