<svg viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full" id="master-diagram">
          <!-- Definitions -->
          <defs>
            <radialGradient id="active-grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 300) rotate(90) scale(300)">
              <stop stop-color="#3b82f6" stop-opacity="0.1"></stop>
              <stop offset="1" stop-color="#3b82f6" stop-opacity="0"></stop>
            </radialGradient>
          </defs>

          <!-- ORBIT RINGS -->
          <g id="diagram-orbit" class="diagram-group" style="opacity: 0.1;">
            <circle cx="300" cy="320" r="260" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" class="opacity-50"></circle>
            <circle cx="300" cy="320" r="220" stroke="#27272a" stroke-width="1" class="opacity-30"></circle>
            <path d="M300 60 L300 90" stroke="#3b82f6" stroke-width="1"></path>
            <path d="M560 320 L530 320" stroke="#3b82f6" stroke-width="1"></path>
            <path d="M40 320 L70 320" stroke="#3b82f6" stroke-width="1"></path>
          </g>

          <!-- ENGINE 1: PROCESS (Top) -->
          <g id="diagram-process" class="diagram-group" style="">
            <circle cx="300" cy="220" r="110" stroke="#3f3f46" stroke-width="1.5" fill="black" fill-opacity="0.2" class=""></circle>
            <text x="300" y="160" text-anchor="middle" class="diagram-label">Process</text>
            <path d="M300 130 L300 150" stroke="currentColor" stroke-width="1" class="text-zinc-800"></path>
          </g>

          <!-- ENGINE 2: MINDSET (Left) -->
          <g id="diagram-mindset" class="diagram-group" style="">
            <circle cx="205" cy="385" r="110" stroke="#3f3f46" stroke-width="1.5" fill="black" fill-opacity="0.2"></circle>
            <text x="160" y="450" text-anchor="middle" class="diagram-label">Mindset</text>
          </g>

          <!-- ENGINE 3: DYNAMICS (Right) -->
          <g id="diagram-dynamics" class="diagram-group" style="">
            <circle cx="395" cy="385" r="110" stroke="#3f3f46" stroke-width="1.5" fill="black" fill-opacity="0.2"></circle>
            <text x="440" y="450" text-anchor="middle" class="diagram-label">Dynamics</text>
          </g>

          <!-- INTERSECTIONS -->
          <g id="diagram-intersections" class="diagram-group opacity-0" style="">
            <!-- Left Intersect -->
            <path d="M260 300 Q280 320 260 360" stroke="#3f3f46" stroke-width="1" fill="none"></path>
            <!-- Right Intersect -->
            <path d="M340 300 Q320 320 340 360" stroke="#3f3f46" stroke-width="1" fill="none"></path>
            <!-- Bottom Intersect -->
            <path d="M300 380 L300 420" stroke="#3f3f46" stroke-width="1" fill="none"></path>
            
            <text x="230" y="300" text-anchor="end" class="text-[8px] fill-zinc-600 uppercase tracking-widest">Deliberate</text>
            <text x="370" y="300" text-anchor="start" class="text-[8px] fill-zinc-600 uppercase tracking-widest">Informed</text>
            <text x="300" y="480" text-anchor="middle" class="text-[8px] fill-zinc-600 uppercase tracking-widest">Realistic</text>
          </g>

          <!-- THE CORE -->
          <g id="diagram-core" class="diagram-group" style="">
            <path d="M300 290 L260 360 L340 360 Z" stroke="#3b82f6" stroke-width="0" fill="#3b82f6" class="core-pulse"></path>
            <circle cx="300" cy="330" r="4" fill="white"></circle>
            <circle cx="300" cy="330" r="40" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2" class="opacity-50 animate-spin-slow"></circle>
          </g>
        </svg>