<svg
      class="fixed top-0 left-0 w-screen h-screen z-10 pointer-events-none opacity-10 mix-blend-overlay"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      preserveAspectRatio="none"
      viewBox="0 0 1920 1080"
    >
      <defs>
        <filter
          id="grainFilter"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.85"
            numOctaves="3"
            stitchTiles="stitch"
            result="noise"
          ></feTurbulence>
          <feColorMatrix
            in="noise"
            type="saturate"
            values="0"
            result="grey"
          ></feColorMatrix>
        </filter>
      </defs>
      <rect
        x="0"
        y="0"
        width="1920"
        height="1080"
        filter="url(#grainFilter)"
        fill="#ffffff"
      ></rect>
    </svg>