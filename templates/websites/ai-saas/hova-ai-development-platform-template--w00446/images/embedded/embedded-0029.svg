<svg viewBox="0 0 200 200" class="mr-auto mb-3 ml-auto w-[128px] h-[128px]" stroke-width="2" data-icon-replaced="true" style="color: rgb(245, 245, 245); width: 128px; height: 128px;">
      <defs></defs>

      <!-- Outer rotating ring -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(163,230,53,0.2)" stroke-width="2" class=""></circle>

      <!-- Middle pulsing ring -->
      <circle cx="100" cy="100" r="60" fill="none" stroke="url(#pulseGradient)" stroke-width="3">
        <animate attributeName="r" values="60;65;60" dur="2s" repeatCount="indefinite"></animate>
        <animate attributeName="stroke-width" values="3;1.5;3" dur="2s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Inner core -->
      <circle cx="100" cy="100" r="40" fill="rgba(163,230,53,0.2)" stroke="rgba(163,230,53,0.6)" stroke-width="2" class="">
        <animate attributeName="r" values="40;42;40" dur="1.5s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Orbiting particles -->
      <circle cx="180" cy="100" r="4" fill="rgba(163,230,53,0.9)">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"></animate>
      </circle>

      <circle cx="140" cy="50" r="3" fill="rgba(163,230,53,0.7)">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"></animate>
      </circle>

      <circle cx="60" cy="50" r="3.5" fill="rgba(163,230,53,0.8)">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Energy waves emanating from center -->
      <circle cx="100" cy="100" r="20" fill="none" stroke="rgba(163,230,53,0.6)" stroke-width="2" opacity="0" class="">
        <animate attributeName="r" values="20;80;80" dur="3s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"></animate>
        <animate attributeName="stroke-width" values="2;0.5;0.5" dur="3s" repeatCount="indefinite"></animate>
      </circle>

      <circle cx="100" cy="100" r="20" fill="none" stroke="rgba(163,230,53,0.6)" stroke-width="2" opacity="0">
        <animate attributeName="r" values="20;80;80" dur="3s" begin="1s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1s" repeatCount="indefinite"></animate>
        <animate attributeName="stroke-width" values="2;0.5;0.5" dur="3s" begin="1s" repeatCount="indefinite"></animate>
      </circle>

      <circle cx="100" cy="100" r="20" fill="none" stroke="rgba(163,230,53,0.6)" stroke-width="2" opacity="0" class="">
        <animate attributeName="r" values="20;80;80" dur="3s" begin="2s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="2s" repeatCount="indefinite"></animate>
        <animate attributeName="stroke-width" values="2;0.5;0.5" dur="3s" begin="2s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Center icon -->
      <path d="M100,85 L100,115 M85,100 L115,100" stroke="rgba(163,230,53,1)" stroke-width="3" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"></animate>
      </path>
      <circle cx="100" cy="100" r="8" fill="rgba(163,230,53,0.3)" stroke="rgba(163,230,53,0.8)" stroke-width="2">
        <animate attributeName="r" values="8;10;8" dur="1.5s" repeatCount="indefinite"></animate>
      </circle>
    </svg>