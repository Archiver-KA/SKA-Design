<svg
      viewBox="0 0 24 24"
      width={size}
      height={size}
      fill="none"
      stroke="currentColor"
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={`icon${filled ? " icon--filled" : ""}${className ? ` ${className}` : ""}`}
      aria-hidden="true"
      focusable="false"
      style={style}
    >
      {glyph}
    </svg>