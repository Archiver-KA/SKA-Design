                                    <circle cx="200" cy="150" r="12" fill="rgba(196,181,253,0.1)" class="animate-pulse" />
                                    
                                    <path d="M600 200 Q 500 350, 300 300" fill="none" stroke="rgba(196,181,253,0.15)" stroke-width="1" />
