                                <!-- Active Nodes & Connections -->
                                <g class="nodes" fill="#C4B5FD">
                                    <path d="M200 150 Q 400 50, 600 200" fill="none" stroke="rgba(196,181,253,0.15)" stroke-width="1" />
                                    <path d="M200 150 Q 400 50, 600 200" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="20 400" class="animate-[dash_4s_linear_infinite]" />
