<svg viewBox="0 0 900 360" class="absolute top-0 right-0 bottom-0 left-0 w-[896px] h-[256px]" fill="none" stroke-width="2" data-icon-replaced="true" style="width: 896px; height: 256px; color: rgb(255, 255, 255);">
              <!-- Animated Dots and Paths -->
              <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
                  <feMerge>
                    <feMergeNode in="coloredBlur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
              </defs>

              <path d="M450 300 C 450 200, 300 120, 150 30" stroke="#f97316" stroke-width="1" stroke-linecap="round" fill="none" style="stroke-dasharray: 600; stroke-dashoffset: 600; opacity: 0.3">
                <animate attributeName="stroke-dashoffset" values="600;0;600" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 300 C 450 210, 360 130, 270 30" stroke="#f97316" stroke-width="1" stroke-linecap="round" fill="none" style="stroke-dasharray: 520; stroke-dashoffset: 520; opacity: 0.3">
                <animate attributeName="stroke-dashoffset" values="520;0;520" dur="4s" begin="0.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 300 C 450 150, 420 80, 390 30" stroke="#f97316" stroke-width="1" stroke-linecap="round" fill="none" style="stroke-dasharray: 450; stroke-dashoffset: 450; opacity: 0.3">
                <animate attributeName="stroke-dashoffset" values="450;0;450" dur="4s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 300 C 450 150, 480 80, 510 30" stroke="#f97316" stroke-width="1" stroke-linecap="round" fill="none" style="stroke-dasharray: 450; stroke-dashoffset: 450; opacity: 0.3">
                <animate attributeName="stroke-dashoffset" values="450;0;450" dur="4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 300 C 450 210, 540 130, 630 30" stroke="#f97316" stroke-width="1" stroke-linecap="round" fill="none" style="stroke-dasharray: 520; stroke-dashoffset: 520; opacity: 0.3" class="">
                <animate attributeName="stroke-dashoffset" values="520;0;520" dur="4s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 300 C 450 200, 600 120, 750 30" stroke="#f97316" stroke-width="1" stroke-linecap="round" fill="none" style="stroke-dasharray: 600; stroke-dashoffset: 600; opacity: 0.3">
                <animate attributeName="stroke-dashoffset" values="600;0;600" dur="4s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>

              <!-- Glowing dots at ends -->
              <circle cx="150" cy="30" r="3" fill="#f97316" filter="url(#glow)">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"></animate>
              </circle>
              <circle cx="750" cy="30" r="3" fill="#f97316" filter="url(#glow)">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"></animate>
              </circle>
            </svg>