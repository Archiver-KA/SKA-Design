<svg viewBox="0 0 320 110" class="h-28 w-full" fill="none" role="img" aria-label="Dual line chart of acoustic level and heart rate rising together around 23:17">
          <!-- grid hairlines -->
          <line x1="0" y1="30" x2="320" y2="30" stroke="#B8A4FF" stroke-opacity="0.08" stroke-width="1"/>
          <line x1="0" y1="60" x2="320" y2="60" stroke="#B8A4FF" stroke-opacity="0.08" stroke-width="1"/>
          <line x1="0" y1="90" x2="320" y2="90" stroke="#B8A4FF" stroke-opacity="0.08" stroke-width="1"/>
          <!-- highlight moment -->
          <line x1="228" y1="8" x2="228" y2="102" stroke="#7B5CFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>
          <!-- acoustic (violet) -->
          <path d="M0 84 C30 82 55 86 80 80 S130 76 155 72 S200 58 228 34 S285 26 320 30" stroke="#7B5CFF" stroke-width="1.5" stroke-linecap="round"/>
          <!-- heart rate (ivory) -->
          <path d="M0 92 C35 90 60 92 90 88 S150 84 175 78 S210 62 228 46 S290 40 320 44" stroke="#EDE7D2" stroke-opacity="0.75" stroke-width="1.5" stroke-linecap="round"/>
          <!-- pulse marker -->
          <circle class="halo" cx="228" cy="34" r="4" fill="#7B5CFF"/>
          <circle class="pulse-dot" cx="228" cy="34" r="3" fill="#B8A4FF"/>
        </svg>