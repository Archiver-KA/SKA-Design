<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 400 400" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="gradientFlow" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="rgba(99, 102, 241, 0)"></stop>
                            <stop offset="50%" stop-color="rgba(167, 139, 250, 1)"></stop>
                            <stop offset="100%" stop-color="rgba(99, 102, 241, 0)"></stop>
                        </linearGradient>
                    </defs>
                    
                    <!-- Path: DB to Center -->
                    <path d="M 80 80 Q 200 80 200 200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"></path>
                    <path d="M 80 80 Q 200 80 200 200" fill="none" stroke="url(#gradientFlow)" stroke-width="2" stroke-dasharray="10 200" stroke-linecap="round">
                        <animate attributeName="stroke-dashoffset" from="210" to="-210" dur="3s" repeatCount="indefinite"></animate>
                    </path>

                    <!-- Path: Outreach to Center -->
                    <path d="M 320 80 Q 200 80 200 200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"></path>
                    <path d="M 320 80 Q 200 80 200 200" fill="none" stroke="url(#gradientFlow)" stroke-width="2" stroke-dasharray="10 200" stroke-linecap="round">
                        <animate attributeName="stroke-dashoffset" from="210" to="-210" dur="3s" begin="1s" repeatCount="indefinite"></animate>
                    </path>

                    <!-- Path: Center to CRM -->
                    <path d="M 200 200 L 200 320" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"></path>
                    <path d="M 200 200 L 200 320" fill="none" stroke="url(#gradientFlow)" stroke-width="2" stroke-dasharray="20 200" stroke-linecap="round">
                        <animate attributeName="stroke-dashoffset" from="220" to="-220" dur="2s" begin="1.5s" repeatCount="indefinite"></animate>
                    </path>
                </svg>