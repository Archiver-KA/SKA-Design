<svg viewBox="0 0 300 260" class="w-full h-full drop-shadow-[0_0_25px_rgba(99,102,241,0.2)]">
            <defs>
              <linearGradient id="triGradientAuth" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#312e81"></stop>
                <stop offset="100%" stop-color="#020617"></stop>
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
                <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
              </filter>
            </defs>
            <!-- Triangle Body -->
            <path d="M 150 20 L 280 240 L 20 240 Z" fill="url(#triGradientAuth)" stroke="#4f46e5" stroke-width="2" class="opacity-90"></path>
            <!-- Inner Connection Lines -->
            <line x1="150" y1="80" x2="150" y2="170" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"></line>
            <line x1="90" y1="190" x2="150" y2="170" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"></line>
            <line x1="210" y1="190" x2="150" y2="170" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"></line>
            <!-- Central Hub -->
            <circle cx="150" cy="170" r="4" fill="#818cf8" class="animate-pulse"></circle>
          </svg>