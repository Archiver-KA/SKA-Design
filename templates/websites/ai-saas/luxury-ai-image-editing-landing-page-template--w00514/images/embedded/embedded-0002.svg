<svg viewBox="0 0 200 200" class="w-full h-full relative z-20 drop-shadow-2xl">
                <defs>
                    <linearGradient id="vLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#b45309" /> <!-- Dark Gold -->
                        <stop offset="40%" stop-color="#f59e0b" /> <!-- Gold -->
                        <stop offset="60%" stop-color="#fcd34d" /> <!-- Light Gold -->
                        <stop offset="100%" stop-color="#fffbeb" /> <!-- Highlight -->
                    </linearGradient>
                    <linearGradient id="vRightGrad" x1="100%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#581c87" /> <!-- Dark Purple -->
                        <stop offset="40%" stop-color="#7c3aed" /> <!-- Brand Purple -->
                        <stop offset="60%" stop-color="#a855f7" /> <!-- Light Purple -->
                        <stop offset="100%" stop-color="#e9d5ff" /> <!-- Highlight -->
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                
                <!-- Left Wing (Gold) -->
                <path d="M100 180 L35 30 L85 30 L100 140 Z" fill="url(#vLeftGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" class="drop-shadow-lg" />
                <!-- Metallic Sheen Left -->
                <path d="M45 35 L75 35 L90 130 L100 180" fill="transparent" stroke="white" stroke-width="2" stroke-opacity="0.2" class="mix-blend-overlay" />

                <!-- Right Wing (Purple) -->
                <path d="M100 180 L165 30 L115 30 L100 140 Z" fill="url(#vRightGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1" class="drop-shadow-lg" />
                <!-- Neon Edge Right -->
                <path d="M165 30 L100 180" fill="transparent" stroke="#d8b4fe" stroke-width="2" filter="url(#glow)" stroke-opacity="0.8" />
                
                <!-- Center Flare Point -->
                <circle cx="20" cy="20" r="15" fill="white" class="mix-blend-overlay blur-xl animate-pulse" transform="translate(145, 10)" />
            </svg>