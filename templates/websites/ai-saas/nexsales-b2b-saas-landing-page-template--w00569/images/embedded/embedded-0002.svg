<svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 1;">
                                <defs>
                                    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" style="stop-color:rgba(45,212,191,0);stop-opacity:0" />
                                        <stop offset="50%" style="stop-color:rgba(45,212,191,0.5);stop-opacity:1" />
                                        <stop offset="100%" style="stop-color:rgba(45,212,191,0);stop-opacity:0" />
                                    </linearGradient>
                                </defs>
                                <!-- Left to Center -->
                                <path d="M 200 300 Q 400 300 550 350" fill="none" stroke="url(#lineGrad)" stroke-width="1" class="animate-pulse" style="opacity:0.3" />
                                <!-- Right to Center -->
                                <path d="M 1000 300 Q 800 300 650 350" fill="none" stroke="url(#lineGrad)" stroke-width="1" class="animate-pulse" style="opacity:0.3; animation-delay: 1s;" />
                             </svg>