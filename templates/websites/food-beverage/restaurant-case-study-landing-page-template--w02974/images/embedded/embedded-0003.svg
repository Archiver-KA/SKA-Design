<svg width="100" height="100" viewBox="0 0 100 100" class="opacity-80 group-hover:opacity-100 transition-opacity">
                                <g transform="translate(50,50)">
                                    <!-- Rotating chaotic shapes -->
                                    <rect x="-20" y="-20" width="40" height="40" stroke="#555" fill="none" class="group-hover:animate-[spin_4s_linear_infinite]"/>
                                    <circle r="15" stroke="#777" fill="none" stroke-dasharray="2 4" class="group-hover:animate-[spin_6s_linear_infinite_reverse]"/>
                                    <path d="M0 -25 L20 10 L-20 10 Z" stroke="#444" fill="none" class="group-hover:animate-[pulse_2s_infinite]"/>
                                    <!-- Glitch lines -->
                                    <line x1="-30" y1="0" x2="30" y2="0" stroke="#9A3412" stroke-width="1" opacity="0" class="group-hover:opacity-100 group-hover:animate-glitch"/>
                                </g>
                            </svg>