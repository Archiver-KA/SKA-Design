<svg class="w-full h-full" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Background Lines connecting sources to main flow -->
                            <path d="M65 0 V40 C65 60 200 60 200 80 V100" stroke="white" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="4 4"></path>
                            <path d="M155 0 V40 C155 60 200 60 200 80 V100" stroke="white" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="4 4"></path>
                            <path d="M245 0 V40 C245 60 200 60 200 80 V100" stroke="white" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="4 4"></path>

                            <!-- Line from Fire (4th icon) to Kitchen Node -->
                            <path d="M335 0 V40 C335 60 200 60 200 80 V100" stroke="url(#paint0_linear)" stroke-width="2" stroke-dasharray="4 4" class="opacity-30"></path>
                            <!-- Animated Pulse on the line -->
                            <path d="M335 0 V40 C335 60 200 60 200 80 V100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 100" class="animate-[dash_3s_linear_infinite]"></path>
                            
                            <!-- Line from Kitchen to Plate -->
                            <path d="M200 180 V220" stroke="white" stroke-opacity="0.1" stroke-width="2"></path>
                            
                            <style class="font-geist">
                                @keyframes dash { to { stroke-dashoffset: -110; } }
                            </style>
                        </svg>