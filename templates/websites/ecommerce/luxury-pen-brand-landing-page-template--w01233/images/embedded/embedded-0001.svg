<svg viewBox="0 0 100 600" class="beaklet-pen" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"></stop>
                    <stop offset="50%" style="stop-color:#475569;stop-opacity:1"></stop>
                    <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"></stop>
                </linearGradient>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#ca8a04;stop-opacity:1"></stop>
                    <stop offset="50%" style="stop-color:#fef08a;stop-opacity:1"></stop>
                    <stop offset="100%" style="stop-color:#a16207;stop-opacity:1"></stop>
                </linearGradient>
            </defs>
            <!-- NIB -->
            <path d="M42,500 L50,560 L58,500 Z" fill="url(#goldGrad)"></path>
            <!-- FEED -->
            <path d="M45,500 L55,500 L50,540 Z" fill="#000"></path>
            <!-- SECTION -->
            <path d="M35,450 Q30,480 40,500 L60,500 Q70,480 65,450 Z" fill="#000"></path>
            <!-- BARREL -->
            <rect x="32" y="150" width="36" height="300" rx="2" fill="url(#bodyGrad)"></rect>
            <!-- CAP -->
            <rect x="28" y="20" width="44" height="180" rx="4" fill="url(#bodyGrad)"></rect>
            <!-- CLIP -->
            <path d="M50,30 L54,30 L53,160 L50,170 L47,160 L46,30 Z" fill="url(#goldGrad)"></path>
            <!-- RINGS -->
            <rect x="28" y="190" width="44" height="8" fill="url(#goldGrad)"></rect>
            <rect x="32" y="440" width="36" height="4" fill="url(#goldGrad)"></rect>
        </svg>