<svg class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Definitions for gradients -->
          <defs>
            <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:transparent"></stop>
              <stop offset="50%" style="stop-color:#F59E0B"></stop>
              <stop offset="100%" style="stop-color:transparent"></stop>
            </linearGradient>
          </defs>

          <!-- Background Paths (Dim) -->
          <path d="M-50,250 C100,250 150,200 300,200" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"></path>
          <path d="M-50,300 C150,300 200,200 300,200" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"></path>
          <path d="M-50,100 C100,100 200,200 300,200" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"></path>

          <!-- Animated Beam Paths -->
          <path class="noodle-path" d="M-50,250 C100,250 150,200 300,200" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round" style="animation-duration: 3s; opacity: 0.6;"></path>
          <path class="noodle-path" d="M-50,300 C150,300 200,200 300,200" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round" style="animation-duration: 4s; animation-delay: 0.5s; opacity: 0.4;"></path>
          <path class="noodle-path" d="M-50,100 C100,100 200,200 300,200" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round" style="animation-duration: 3.5s; animation-delay: 1s; opacity: 0.5;"></path>
        </svg>