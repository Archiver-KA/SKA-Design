<svg class="absolute inset-0 w-full h-full z-0 overflow-visible pointer-events-none">
                                    <defs>
                                        <filter id="glow-connector">
                                            <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
                                            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                                        </filter>
                                    </defs>
                                    <!-- Flow Lines -->
                                    <path d="M 120 200 L 220 200 L 220 150 L 300 150" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.22" fill="none"></path>
                                    <path d="M 220 200 L 220 250 L 300 250" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.22" fill="none"></path>
                                    
                                    <!-- Animated Dots -->
                                    <circle r="2" fill="#06b6d4" filter="url(#glow-connector)">
                                        <animateMotion dur="3s" repeatCount="indefinite" path="M 120 200 L 220 200 L 220 150 L 300 150" calcMode="linear"></animateMotion>
                                    </circle>
                                    <circle r="2" fill="#06b6d4" filter="url(#glow-connector)">
                                        <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M 220 200 L 220 250 L 300 250" calcMode="linear"></animateMotion>
                                    </circle>
                                </svg>