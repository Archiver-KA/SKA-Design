<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><style>@keyframes pan { 0% { transform: scale(1.1) translate(0,0) rotate(0deg); } 50% { transform: scale(1.15) translate(-1.5%,-1.5%) rotate(1.5deg); } 100% { transform: scale(1.1) translate(0,0) rotate(0deg); } } .bg { animation: pan 25s ease-in-out infinite; transform-origin: center; }</style><g class="bg"><image href="https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&q=80&w=1200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" opacity="0.5"/></g><rect width="100%" height="100%" fill="#D4AF37" opacity="0.3" style="mix-blend-mode: color;"/></svg>