<svg viewBox="0 0 900 300" class="absolute inset-0 w-full h-full opacity-90" fill="none" stroke-width="2">
              <defs>
                <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
                  <feMerge>
                    <feMergeNode in="coloredBlur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
              </defs>

              <path d="M450 250 C 450 180, 250 120, 190 40" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="400" stroke-dashoffset="400" opacity="0.6">
                <animate attributeName="stroke-dashoffset" values="400;0;400" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 250 C 450 180, 450 120, 450 40" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="400" stroke-dashoffset="400" opacity="0.6">
                <animate attributeName="stroke-dashoffset" values="400;0;400" dur="3s" begin="0.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>
              <path d="M450 250 C 450 180, 650 120, 710 40" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="400" stroke-dashoffset="400" opacity="0.6">
                <animate attributeName="stroke-dashoffset" values="400;0;400" dur="3s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animate>
              </path>

              <circle cx="190" cy="40" r="3" fill="#ef4444" filter="url(#glow-red)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"></animate>
              </circle>
              <circle cx="450" cy="40" r="3" fill="#ef4444" filter="url(#glow-red)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.2s" repeatCount="indefinite"></animate>
              </circle>
              <circle cx="710" cy="40" r="3" fill="#ef4444" filter="url(#glow-red)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"></animate>
              </circle>
            </svg>