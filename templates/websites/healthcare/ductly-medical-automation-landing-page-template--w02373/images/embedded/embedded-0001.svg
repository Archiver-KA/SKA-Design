<svg
              class="min-w-[980px] w-full h-[420px]"
              viewBox="0 0 980 420"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Schemat przepływu danych"
            >
              <defs>
                <filter
                  id="ductlyGlowBlue"
                  x="-50%"
                  y="-50%"
                  width="200%"
                  height="200%"
                >
                  <feGaussianBlur
                    stdDeviation="12"
                    result="blur"
                  ></feGaussianBlur>
                  <feMerge>
                    <feMergeNode in="blur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
                <filter
                  id="ductlyGlowCyan"
                  x="-50%"
                  y="-50%"
                  width="200%"
                  height="200%"
                >
                  <feGaussianBlur
                    stdDeviation="8"
                    result="blur"
                  ></feGaussianBlur>
                  <feMerge>
                    <feMergeNode in="blur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
                <linearGradient id="ductlyPath" x1="0" y1="0" x2="1" y2="0">
                  <stop
                    offset="0"
                    stop-color="#0047AB"
                    stop-opacity="0.35"
                  ></stop>
                  <stop
                    offset="0.5"
                    stop-color="#00FFFF"
                    stop-opacity="0.6"
                  ></stop>
                  <stop
                    offset="1"
                    stop-color="#0047AB"
                    stop-opacity="0.35"
                  ></stop>
                </linearGradient>

                <circle
                  id="dot"
                  r="4"
                  fill="#00FFFF"
                  opacity="0.9"
                  filter="url(#ductlyGlowCyan)"
                ></circle>
              </defs>

              <!-- dashed paths: inputs -> center -->
              <path
                class="wf-path"
                d="M 220 110 C 320 110, 350 170, 430 190"
                stroke="url(#ductlyPath)"
                stroke-width="2"
                stroke-dasharray="6 7"
                opacity="0.9"
              ></path>
              <path
                class="wf-path"
                d="M 220 210 C 320 210, 350 210, 430 210"
                stroke="url(#ductlyPath)"
