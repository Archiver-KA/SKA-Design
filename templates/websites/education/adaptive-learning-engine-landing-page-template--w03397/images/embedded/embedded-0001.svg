<svg width="300" height="150" viewBox="0 0 300 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- Grid/Axes -->
                                <defs>
                                    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
                                        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#27272a" stroke-width="0.5"/>
                                    </pattern>
                                </defs>
                                <rect width="300" height="150" fill="url(#smallGrid)" />
                                
                                <!-- X and Y Axes -->
                                <line x1="10" y1="75" x2="290" y2="75" stroke="#52525b" stroke-width="1" />
                                <line x1="150" y1="10" x2="150" y2="140" stroke="#52525b" stroke-width="1" />
                                <text x="280" y="70" fill="#71717a" font-size="8" font-family="monospace">Re</text>
                                <text x="155" y="15" fill="#71717a" font-size="8" font-family="monospace">Im</text>

                                <!-- Circle Center C(2, -1) -> Mapped roughly to visual coords -->
                                <!-- Let origin be (150, 75). Scale 20px per unit. -->
                                <!-- C(2, -1) => (150 + 40, 75 + 20) => (190, 95) -->
                                <!-- Radius sqrt(5) approx 2.23 units => 44.6px -->
                                
                                <!-- Region Outside Circle (Hashed or indicated) -->
                                <circle cx="190" cy="95" r="45" stroke="#f43f5e" stroke-width="1.5" fill="rgba(244, 63, 94, 0.05)" stroke-dasharray="4 2"/>
                                
                                <!-- Point C -->
                                <circle cx="190" cy="95" r="2" fill="#f43f5e"/>
                                <text x="195" y="105" fill="#f43f5e" font-size="8" font-family="monospace">C(2,-i)</text>

                                <!-- Point P(1, 0) => (150 + 20, 75) => (170, 75) -->
                                <circle cx="170" cy="75" r="2" fill="#fff"/>
                                <text x="165" y="65" fill="#fff" font-size="8" font-family="monospace">P(1,0)</text>

                                <!-- Line connecting C to boundary through P -->
                                <!-- Vector CP = (-20, -20). Angle 225 deg (visual). -->
                                <!-- z0 is intersection on boundary closest to P -->
                                <line x1="190" y1="95" x2="158" y2="63" stroke="#71717a" stroke-width="1" stroke-dasharray="2 2"/>
                                
                                <!-- z0 Point -->
                                <circle cx="158" cy="63" r="3" fill="#38bdf8"/>
                                <text x="145" y="55" fill="#38bdf8" font-size="9" font-family="monospace" font-weight="bold">z₀</text>

                                <!-- Label z region -->
                                <text x="240" y="100" fill="#52525b" font-size="8" font-family="monospace">|z-C| ≥ √5</text>
                            </svg>