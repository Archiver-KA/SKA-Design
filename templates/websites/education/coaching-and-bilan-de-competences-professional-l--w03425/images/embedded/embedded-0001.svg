<svg width="100%" height="100%" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" class="select-none uppercase cursor-pointer" id="hover-svg">
                <defs>
                    <linearGradient id="textGradient" gradientUnits="userSpaceOnUse" cx="50%" cy="50%" r="25%">
                        <stop offset="0%" stop-color="#F1EBE1"></stop>
                        <stop offset="50%" stop-color="#ffffff"></stop>
                        <stop offset="100%" stop-color="#F1EBE1"></stop>
                    </linearGradient>

                    <radialGradient id="revealMask" gradientUnits="userSpaceOnUse" r="15%" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="white"></stop>
                        <stop offset="100%" stop-color="black"></stop>
                    </radialGradient>
                    <mask id="textMask">
                        <rect x="0" y="0" width="100%" height="100%" fill="url(#revealMask)"></rect>
                    </mask>
                </defs>
                
                <!-- Hovered outline base text -->
                <text id="base-text" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" stroke-width="0.3" class="fill-transparent stroke-[#F1EBE1]/10 font-poppins text-5xl font-bold" style="opacity: 0; transition: opacity 0.3s ease-out;">
                    GÉRALDINE
                </text>
                
                <!-- Animated dashed stroke -->
                <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" stroke-width="0.3" class="fill-transparent stroke-[#F1EBE1]/40 font-poppins text-5xl font-bold hover-stroke-text pointer-events-none">
                    GÉRALDINE
                </text>
                
                <!-- Masked revealed gradient text -->
                <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" stroke="url(#textGradient)" stroke-width="0.3" mask="url(#textMask)" class="fill-transparent font-poppins text-5xl font-bold pointer-events-none">
                    GÉRALDINE
                </text>
            </svg>