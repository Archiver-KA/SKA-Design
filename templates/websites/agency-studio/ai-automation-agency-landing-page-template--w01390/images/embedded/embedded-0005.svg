<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="pipe-grad" gradientUnits="userSpaceOnUse" x1="250" y1="250" x2="100" y2="100">
                        <stop offset="0" stop-color="#38bdf8" stop-opacity="0.6"></stop>
                        <stop offset="1" stop-color="#38bdf8" stop-opacity="0.1"></stop>
                      </linearGradient>
                    </defs>
                    <!-- Adjusted Paths for wider layout -->
                    <path d="M250,250 L80,110" stroke="url(#pipe-grad)" stroke-width="1" class="animate-radiate" style="animation-duration: 4s"></path>
                    <path d="M250,250 L420,80" stroke="url(#pipe-grad)" stroke-width="1" class="animate-radiate" style="animation-delay: -1s; animation-duration: 5s"></path>
                    <path d="M250,250 L440,320" stroke="url(#pipe-grad)" stroke-width="1" class="animate-radiate" style="animation-delay: -0.5s; animation-duration: 3s"></path>
                    <path d="M250,250 L100,400" stroke="url(#pipe-grad)" stroke-width="1" class="animate-radiate" style="animation-delay: -2s; animation-duration: 4.5s"></path>
                  </svg>