                            <path d="M100,150 C200,150 250,200 350,200" fill="none" stroke="currentColor" class="text-neutral-700" stroke-width="1" stroke-dasharray="4 4"></path>
                            
                            <!-- Dots -->
                            <circle cx="100" cy="150" r="4" class="text-blue-500 fill-current"></circle> <!-- Ad -->
