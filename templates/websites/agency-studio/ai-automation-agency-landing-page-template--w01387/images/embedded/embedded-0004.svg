<svg
          class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible"
          viewBox="0 0 600 600"
        >
          <defs></defs>

          <!-- Connecting Beams -->
          <!-- Group 1 -->
          <g>
            <path
              d="M -50 150 C 100 150, 100 300, 300 300"
              fill="none"
              stroke="white"
              stroke-width="1"
              class="opacity-[0.08]"
            ></path>
            <path
              d="M -50 150 C 100 150, 100 300, 300 300"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1.5"
              class="beam-line animate-beam opacity-60"
            ></path>
          </g>
          <!-- Group 2 -->
          <g>
            <path
              d="M -50 450 C 100 450, 100 300, 300 300"
              fill="none"
              stroke="white"
              stroke-width="1"
              class="opacity-[0.08]"
            ></path>
            <path
              d="M -50 450 C 100 450, 100 300, 300 300"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1.5"
              class="beam-line animate-beam opacity-60"
              style="animation-delay: -1s;"
            ></path>
          </g>
          <!-- Group 3 -->
          <g>
            <path
              d="M 650 100 C 500 100, 500 300, 300 300"
              fill="none"
              stroke="white"
              stroke-width="1"
              class="opacity-[0.08]"
            ></path>
            <path
              d="M 650 100 C 500 100, 500 300, 300 300"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1.5"
              class="beam-line animate-beam opacity-60"
              style="animation-delay: -2s;"
            ></path>
          </g>
          <!-- Group 4 -->
          <g>
            <path
              d="M 650 500 C 500 500, 500 300, 300 300"
              fill="none"
              stroke="white"
              stroke-width="1"
              class="opacity-[0.08]"
            ></path>
            <path
              d="M 650 500 C 500 500, 500 300, 300 300"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1.5"
              class="beam-line animate-beam opacity-60"
              style="animation-delay: -1.5s;"
            ></path>
          </g>

          <!-- CENTRAL NODE DETAIL -->
          <g transform="translate(300, 300)">
            <!-- Ambient Glow -->
            <circle
              r="120"
              fill="url(#center-glow)"
              class="animate-pulse"
            ></circle>

            <!-- Sonar Waves -->
            <circle
              r="20"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1"
              opacity="0.5"
              class="animate-sonar"
            ></circle>
            <circle
              r="20"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1"
              opacity="0.5"
              class="animate-sonar delay-1000"
            ></circle>
            <circle
              r="20"
              fill="none"
              stroke="#38BDF8"
              stroke-width="1"
              opacity="0.5"
              class="animate-sonar delay-2000"
            ></circle>

            <!-- Technical Rings -->
            <!-- Outer Dashed Ring Slow -->
            <circle
              r="65"
              fill="none"
              stroke="white"
              stroke-opacity="0.1"
              stroke-width="1"
              stroke-dasharray="10 20"
              class="animate-spin-slow"
            ></circle>

            <!-- Inner Dashed Ring Reverse -->
            <circle
              r="45"
              fill="none"
              stroke="#38BDF8"
              stroke-opacity="0.2"
              stroke-width="1"
              stroke-dasharray="4 6"
              class="animate-spin-slow-reverse"
            ></circle>

            <!-- Crosshair Markers -->
            <g class="animate-spin-slow" style="animation-duration: 20s;">
              <path
                d="M -80 0 L -70 0"
                stroke="white"
                stroke-opacity="0.2"
              ></path>
              <path
                d="M 80 0 L 70 0"
                stroke="white"
                stroke-opacity="0.2"
              ></path>
              <path
                d="M 0 -80 L 0 -70"
                stroke="white"
                stroke-opacity="0.2"
              ></path>
              <path
                d="M 0 80 L 0 70"
                stroke="white"
                stroke-opacity="0.2"
              ></path>
            </g>

            <!-- Core -->
            <circle
              r="8"
              fill="#0A0A0A"
              stroke="#38BDF8"
              stroke-width="2"
            ></circle>
            <circle r="4" fill="#38BDF8" class="animate-pulse-fast"></circle>
          </g>
        </svg>