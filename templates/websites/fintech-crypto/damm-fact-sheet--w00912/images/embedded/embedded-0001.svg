<svg class="w-full h-full" preserveAspectRatio="none" viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grid-fade" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"></stop>
                            <stop offset="15%" stop-color="#0a0a0a" stop-opacity="0"></stop>
                            <stop offset="85%" stop-color="#0a0a0a" stop-opacity="0"></stop>
                            <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"></stop>
                        </linearGradient>
                        <filter id="glow-effect" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
                            <feMerge>
                                <feMergeNode in="coloredBlur"></feMergeNode>
                                <feMergeNode in="SourceGraphic"></feMergeNode>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Coordinate Grid -->
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BFFF00" stroke-width="0.5" stroke-opacity="0.1"></path>
                    </pattern>
                    <rect width="100%" height="100%" fill="url(#grid)"></rect>

                    <!-- AMM Bonding Curves -->
                    <!-- Curve 1: Hyperbolic y=k/x -->
                    <path d="M -50 280 Q 400 250 800 50" fill="none" stroke="#BFFF00" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glow-effect)"></path>
                    <!-- Curve 2: Secondary Metric -->
                    <path d="M -50 300 Q 450 280 850 100" fill="none" stroke="#BFFF00" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"></path>
                    
                    <!-- Mathematical Annotations -->
                    <g font-family="Geist Mono, monospace" font-size="10" fill="#BFFF00" opacity="0.6">
                        <text x="700" y="60">x · y = k</text>
                        <text x="350" y="200">Δ = ∂V/∂S</text>
                        <text x="100" y="250" opacity="0.4">Sharpe (3.4)</text>
                    </g>

                    <!-- Floating Data Points -->
                    <circle cx="400" cy="180" r="3" fill="#BFFF00" opacity="0.8">
                        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"></animate>
                    </circle>
                    <circle cx="600" cy="120" r="2" fill="#BFFF00" opacity="0.5"></circle>
                    <circle cx="750" cy="65" r="2" fill="#BFFF00" opacity="0.5"></circle>

                    <!-- Tangent Line -->
                    <line x1="340" y1="210" x2="460" y2="150" stroke="#BFFF00" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2 2"></line>
                </svg>