<svg
          viewBox="0 0 800 800"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="w-full h-full"
        >
          <g class="animate-spin-slow">
            <circle cx="400" cy="400" r="390" class="orbit-path"></circle>
            <circle
              cx="790"
              cy="400"
              r="4"
              fill="#315EFB"
              class="animate-pulse-soft"
            ></circle>
            <circle cx="10" cy="400" r="3" fill="#9CA3AF"></circle>
          </g>
          <g class="animate-spin-slow-reverse" style="animation-duration: 45s;">
            <circle cx="400" cy="400" r="300" class="orbit-path"></circle>
            <circle
              cx="400"
              cy="100"
              r="5"
              fill="#315EFB"
              class="animate-pulse-soft"
            ></circle>
            <circle cx="400" cy="700" r="4" fill="#9CA3AF"></circle>
          </g>
          <g class="animate-spin-slow" style="animation-duration: 25s;">
            <circle cx="400" cy="400" r="200" class="orbit-path"></circle>
            <circle
              cx="600"
              cy="400"
              r="6"
              fill="#315EFB"
              fill-opacity="0.8"
            ></circle>
          </g>
          <path
            d="M400 100 L600 400 L400 700 L10"
            stroke="url(#gradient-line)"
            stroke-width="1.5"
            class="network-line"
            opacity="0.6"
          ></path>
          <path
            d="M790 400 L400 400 L400 100"
            stroke="url(#gradient-line)"
            stroke-width="1.5"
            class="network-line"
            style="animation-delay: 1s;"
            opacity="0.4"
          ></path>
          <circle
            cx="400"
            cy="400"
            r="100"
            fill="url(#core-glow)"
            opacity="0.15"
            class="animate-pulse-soft"
          ></circle>
          <circle
            cx="400"
            cy="400"
            r="100"
            stroke="rgba(49, 94, 251, 0.2)"
            stroke-width="1"
            stroke-dasharray="2 4"
            class="animate-spin-slow"
          ></circle>
          <defs>
            <linearGradient
              id="gradient-line"
              x1="0"
              y1="0"
              x2="800"
              y2="800"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#315EFB" stop-opacity="0"></stop>
              <stop offset="0.5" stop-color="#315EFB"></stop>
              <stop offset="1" stop-color="#315EFB" stop-opacity="0"></stop>
            </linearGradient>
            <radialGradient id="core-glow" cx="0.5" cy="0.5" r="0.5">
              <stop stop-color="#315EFB"></stop>
              <stop offset="1" stop-color="#315EFB" stop-opacity="0"></stop>
            </radialGradient>
          </defs>
        </svg>