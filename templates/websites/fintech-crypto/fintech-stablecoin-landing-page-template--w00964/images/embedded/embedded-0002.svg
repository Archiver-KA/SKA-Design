<svg
                  class="absolute w-[180%] h-[180%] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-20 z-0"
                  viewBox="0 0 800 800"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g class="animate-spin-slow">
                    <circle
                      cx="400"
                      cy="400"
                      r="280"
                      stroke="#315EFB"
                      stroke-width="1.5"
                      stroke-dasharray="4 8"
                    ></circle>
                    <circle
                      cx="400"
                      cy="400"
                      r="380"
                      stroke="#315EFB"
                      stroke-width="1"
                      stroke-dasharray="2 12"
                    ></circle>
                    <circle
                      cx="400"
                      cy="400"
                      r="180"
                      stroke="#315EFB"
                      stroke-width="1"
                      opacity="0.3"
                    ></circle>
                    <circle
                      cx="680"
                      cy="400"
                      r="5"
                      fill="#315EFB"
                      class="animate-pulse-soft"
                    ></circle>
                    <circle
                      cx="120"
                      cy="400"
                      r="4"
                      fill="#315EFB"
                      class="animate-pulse-soft"
                    ></circle>
                    <circle
                      cx="400"
                      cy="120"
                      r="6"
                      fill="#315EFB"
                      class="animate-pulse-soft"
                    ></circle>
                  </g>
                  <g
                    class="animate-spin-slow-reverse"
                    style="animation-duration: 40s;"
                  >
                    <circle
                      cx="400"
                      cy="400"
                      r="330"
                      stroke="#9CA3AF"
                      stroke-width="1"
                      stroke-dasharray="3 9"
                      opacity="0.5"
                    ></circle>
                    <circle cx="730" cy="400" r="3" fill="#9CA3AF"></circle>
                    <circle cx="400" cy="730" r="4" fill="#315EFB"></circle>
                  </g>
                  <path
                    d="M400 120 Q 550 250 680 400"
                    stroke="url(#globe-glow2)"
                    stroke-width="2"
                    class="flow-stroke"
                  ></path>
                  <path
                    d="M120 400 Q 250 550 400 730"
                    stroke="url(#globe-glow2)"
                    stroke-width="2"
                    class="flow-stroke"
                    style="animation-delay: 0.5s;"
                  ></path>
                  <path
                    d="M680 400 Q 550 550 400 730"
                    stroke="url(#globe-glow2)"
                    stroke-width="1.5"
                    class="flow-stroke"
                    style="animation-delay: 1s;"
                  ></path>
                  <defs>
                    <linearGradient
                      id="globe-glow2"
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                    >
                      <stop stop-color="#315EFB" stop-opacity="0"></stop>
                      <stop
                        offset="0.5"
                        stop-color="#315EFB"
                        stop-opacity="0.8"
                      ></stop>
                      <stop
                        offset="1"
                        stop-color="#315EFB"
                        stop-opacity="0"
                      ></stop>
                    </linearGradient>
                  </defs>
                </svg>