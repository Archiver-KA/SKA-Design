<svg
              width="100%"
              height="100%"
              viewBox="0 0 400 200"
              preserveAspectRatio="none"
              class="text-brand-500"
            >
              <!-- Depth Chart Area -->
              <path
                d="M0 200 L 0 150 Q 50 150 100 140 T 180 100 L 200 80 L 220 100 Q 250 120 300 140 T 400 150 L 400 200 Z"
                fill="url(#depthGradient)"
                stroke="none"
              ></path>
              <path
                d="M0 150 Q 50 150 100 140 T 180 100 L 200 80 L 220 100 Q 250 120 300 140 T 400 150"
                fill="none"
                stroke="url(#lineGradient)"
                stroke-width="1"
              ></path>
              <defs>
                <linearGradient id="depthGradient" x1="0" y1="0" x2="1" y2="0">
                  <stop
                    offset="0%"
                    stop-color="#10B981"
                    stop-opacity="0.2"
                  ></stop>
                  <stop
                    offset="45%"
                    stop-color="#10B981"
                    stop-opacity="0.4"
                  ></stop>
                  <stop
                    offset="50%"
                    stop-color="transparent"
                    stop-opacity="0"
                  ></stop>
                  <stop
                    offset="55%"
                    stop-color="#EF4444"
                    stop-opacity="0.4"
                  ></stop>
                  <stop
                    offset="100%"
                    stop-color="#EF4444"
                    stop-opacity="0.2"
                  ></stop>
                </linearGradient>
                <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#10B981"></stop>
                  <stop offset="45%" stop-color="#10B981"></stop>
                  <stop offset="50%" stop-color="white"></stop>
                  <stop offset="55%" stop-color="#EF4444"></stop>
                  <stop offset="100%" stop-color="#EF4444"></stop>
                </linearGradient>
              </defs>
            </svg>