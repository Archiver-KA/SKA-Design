<svg
                    class="absolute inset-0 w-full h-full pt-16 px-6 pb-6"
                    preserveAspectRatio="none"
                    viewBox="0 0 400 200"
                  >
                    <defs>
                      <linearGradient
                        id="chartGradient"
                        x1="0"
                        x2="0"
                        y1="0"
                        y2="1"
                      >
                        <stop
                          offset="0%"
                          stop-color="#F59E0B"
                          stop-opacity="0.15"
                        ></stop>
                        <stop
                          offset="100%"
                          stop-color="transparent"
                          stop-opacity="0"
                        ></stop>
                      </linearGradient>
                      <filter id="glow">
                        <feGaussianBlur
                          stdDeviation="1.5"
                          result="coloredBlur"
                        ></feGaussianBlur>
                        <feMerge>
                          <feMergeNode in="coloredBlur"></feMergeNode>
                          <feMergeNode in="SourceGraphic"></feMergeNode>
                        </feMerge>
                      </filter>
                    </defs>
                    <!-- Grid Lines -->
                    <path
                      d="M0 50 H400 M0 100 H400 M0 150 H400"
                      stroke="rgba(255,255,255,0.05)"
                      stroke-width="1"
                      vector-effect="non-scaling-stroke"
                    ></path>
                    <!-- Main Chart Line -->
                    <path
                      d="M0 130 C 40 120, 80 150, 120 110 S 180 50, 240 90 S 320 130, 360 70 L 400 60"
                      fill="none"
                      stroke="#F59E0B"
                      stroke-width="1.5"
                      filter="url(#glow)"
                      vector-effect="non-scaling-stroke"
                    ></path>
                    <path
                      d="M0 130 C 40 120, 80 150, 120 110 S 180 50, 240 90 S 320 130, 360 70 L 400 60 V 200 H 0 Z"
                      fill="url(#chartGradient)"
                    ></path>
                    <!-- Moving Cursor -->
                    <line
                      x1="300"
                      y1="0"
                      x2="300"
                      y2="200"
                      stroke="rgba(255,255,255,0.2)"
                      stroke-dasharray="2 2"
                    >
                      <animate
                        attributeName="x1"
                        values="0;400;0"
                        dur="12s"
                        repeatCount="indefinite"
                      ></animate>
                      <animate
                        attributeName="x2"
                        values="0;400;0"
                        dur="12s"
                        repeatCount="indefinite"
                      ></animate>
                    </line>
                    <!-- Data Point -->
                    <circle
                      cx="300"
                      cy="75"
                      r="2.5"
                      fill="white"
                      stroke="#F59E0B"
                      stroke-width="1"
                    >
                      <animate
                        attributeName="cx"
                        values="0;400;0"
                        dur="12s"
                        repeatCount="indefinite"
                      ></animate>
                      <animate
                        attributeName="cy"
                        values="130;110;90;70;60;70;90;110;130"
                        dur="12s"
                        repeatCount="indefinite"
                      ></animate>
                    </circle>
                  </svg>