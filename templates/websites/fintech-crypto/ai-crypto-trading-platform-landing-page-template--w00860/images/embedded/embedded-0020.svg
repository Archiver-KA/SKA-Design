<svg class="pointer-events-none z-0 w-full h-full absolute top-0 right-0 bottom-0 left-0" viewBox="0 0 400 400" preserveAspectRatio="none">
                            <defs>
                                <filter id="glow-mesh" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="2" result="coloredBlur"></feGaussianBlur>
                                    <feMerge>
                                        <feMergeNode in="coloredBlur"></feMergeNode>
                                        <feMergeNode in="SourceGraphic"></feMergeNode>
                                    </feMerge>
                                </filter>
                            </defs>

                            <!-- TL to Center -->
                            <path d="M60 60 C 60 150, 200 60, 200 200" stroke="#3f3f46" stroke-width="1" fill="none" opacity="0.2"></path>
                            <path d="M60 60 C 60 150, 200 60, 200 200" stroke="#87FE00" stroke-width="2" fill="none" stroke-dasharray="8 150" stroke-linecap="round" filter="url(#glow-mesh)">
                                <animate attributeName="stroke-dashoffset" values="158; 0" dur="3s" repeatCount="indefinite"></animate>
                            </path>

                            <!-- TR to Center -->
                            <path d="M340 60 C 340 150, 200 60, 200 200" stroke="#3f3f46" stroke-width="1" fill="none" opacity="0.2"></path>
                            <path d="M340 60 C 340 150, 200 60, 200 200" stroke="#87FE00" stroke-width="2" fill="none" stroke-dasharray="8 150" stroke-linecap="round" filter="url(#glow-mesh)">
                                <animate attributeName="stroke-dashoffset" values="158; 0" dur="3s" begin="0.5s" repeatCount="indefinite"></animate>
                            </path>

                            <!-- BL to Center -->
                            <path d="M60 340 C 60 250, 200 340, 200 200" stroke="#3f3f46" stroke-width="1" fill="none" opacity="0.2"></path>
                            <path d="M60 340 C 60 250, 200 340, 200 200" stroke="#87FE00" stroke-width="2" fill="none" stroke-dasharray="8 150" stroke-linecap="round" filter="url(#glow-mesh)">
                                <animate attributeName="stroke-dashoffset" values="158; 0" dur="3s" begin="1s" repeatCount="indefinite"></animate>
                            </path>

                            <!-- BR to Center -->
                            <path d="M340 340 C 340 250, 200 340, 200 200" stroke="#3f3f46" stroke-width="1" fill="none" opacity="0.2"></path>
                            <path d="M340 340 C 340 250, 200 340, 200 200" stroke="#87FE00" stroke-width="2" fill="none" stroke-dasharray="8 150" stroke-linecap="round" filter="url(#glow-mesh)">
                                <animate attributeName="stroke-dashoffset" values="158; 0" dur="3s" begin="1.5s" repeatCount="indefinite"></animate>
                            </path>
                            
                            <!-- Pulsing Nodes at Corners -->
                            <circle cx="60" cy="60" r="4" fill="#87FE00" filter="url(#glow-mesh)">
                                <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"></animate>
                            </circle>
                            <circle cx="340" cy="60" r="4" fill="#605DE0" filter="url(#glow-mesh)">
                                <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"></animate>
                            </circle>
                            <circle cx="60" cy="340" r="4" fill="#F43F5E" filter="url(#glow-mesh)">
                                <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"></animate>
                            </circle>
                            <circle cx="340" cy="340" r="4" fill="#F59E0B" filter="url(#glow-mesh)">
                                <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"></animate>
                            </circle>
                        </svg>