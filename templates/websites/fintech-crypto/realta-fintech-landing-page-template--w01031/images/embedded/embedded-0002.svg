<svg
                    class="w-full h-full"
                    viewBox="0 0 400 400"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <defs>
                      <linearGradient
                        id="eq-top"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                      >
                        <stop
                          offset="0%"
                          stop-color="#ffffff"
                          stop-opacity="1"
                        ></stop>
                        <stop
                          offset="100%"
                          stop-color="#eef3f0"
                          stop-opacity="0.8"
                        ></stop>
                      </linearGradient>
                      <linearGradient
                        id="eq-left"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%"
                      >
                        <stop
                          offset="0%"
                          stop-color="#dce7e2"
                          stop-opacity="0.9"
                        ></stop>
                        <stop
                          offset="100%"
                          stop-color="#a5b7b1"
                          stop-opacity="1"
                        ></stop>
                      </linearGradient>
                      <linearGradient
                        id="eq-right"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%"
                      >
                        <stop
                          offset="0%"
                          stop-color="#879f98"
                          stop-opacity="0.8"
                        ></stop>
                        <stop
                          offset="100%"
                          stop-color="#4b615a"
                          stop-opacity="0.95"
                        ></stop>
                      </linearGradient>
                      <filter
                        id="eq-shadow"
                        x="-30%"
                        y="-30%"
                        width="160%"
                        height="160%"
                      >
                        <feDropShadow
                          dx="0"
                          dy="25"
                          stdDeviation="20"
                          flood-color="#132a24"
                          flood-opacity="0.08"
                        ></feDropShadow>
                      </filter>
                      <filter
                        id="eq-glow"
                        x="-50%"
                        y="-50%"
                        width="200%"
                        height="200%"
                      >
                        <feGaussianBlur
                          stdDeviation="8"
                          result="blur"
                        ></feGaussianBlur>
                        <feComposite
                          in="SourceGraphic"
                          in2="blur"
                          operator="over"
                        ></feComposite>
                      </filter>
                    </defs>
                    <g opacity="0.1" stroke="#4b615a" stroke-width="1">
                      <line x1="0" y1="300" x2="400" y2="100"></line>
                      <line x1="0" y1="350" x2="400" y2="150"></line>
                      <line x1="0" y1="400" x2="400" y2="200"></line>
                      <line x1="100" y1="0" x2="100" y2="400"></line>
                      <line x1="200" y1="0" x2="200" y2="400"></line>
                      <line x1="300" y1="0" x2="300" y2="400"></line>
                    </g>
                    <g
                      class="animate-[float_6s_ease-in-out_infinite]"
                      style="animation-delay: 0s;"
                    >
                      <g filter="url(#eq-shadow)">
                        <path
                          d="M 80 260 L 120 280 L 120 330 L 80 310 Z"
                          fill="url(#eq-left)"
                        ></path>
                        <path
                          d="M 120 280 L 160 260 L 160 310 L 120 330 Z"
                          fill="url(#eq-right)"
                        ></path>
                        <path
                          d="M 120 240 L 160 260 L 120 280 L 80 260 Z"
                          fill="url(#eq-top)"
                          stroke="#ffffff"
                          stroke-width="0.5"
                        ></path>
                      </g>
                    </g>
                    <g
                      class="animate-[float_6s_ease-in-out_infinite]"
                      style="animation-delay: -2s;"
                    >
                      <g filter="url(#eq-shadow)">
                        <path
                          d="M 170 185 L 210 205 L 210 285 L 170 265 Z"
                          fill="url(#eq-left)"
                        ></path>
                        <path
                          d="M 210 205 L 250 185 L 250 265 L 210 285 Z"
                          fill="url(#eq-right)"
                        ></path>
                        <path
                          d="M 210 165 L 250 185 L 210 205 L 170 185 Z"
                          fill="url(#eq-top)"
                          stroke="#ffffff"
                          stroke-width="0.5"
                        ></path>
                      </g>
                    </g>
                    <g
                      class="animate-[float_6s_ease-in-out_infinite]"
                      style="animation-delay: -4s;"
                    >
                      <g filter="url(#eq-shadow)">
                        <path
                          d="M 260 100 L 300 120 L 300 240 L 260 220 Z"
                          fill="url(#eq-left)"
                        ></path>
                        <path
                          d="M 300 120 L 340 100 L 340 220 L 300 240 Z"
                          fill="url(#eq-right)"
                        ></path>
                        <g class="animate-[float_4s_ease-in-out_infinite]">
                          <path
                            d="M 300 70 L 340 90 L 300 110 L 260 90 Z"
                            fill="url(#eq-top)"
                            stroke="#ffffff"
                            stroke-width="1"
                            filter="url(#eq-glow)"
                          ></path>
                        </g>
                      </g>
                    </g>
                    <g class="animate-[pulse_4s_ease-in-out_infinite]">
                      <polyline
                        points="120,260 210,185 300,90"
                        fill="none"
                        stroke="#4b615a"
                        stroke-width="2"
                        stroke-dasharray="6 4"
                        opacity="0.6"
                      ></polyline>
                      <circle
                        cx="120"
                        cy="260"
                        r="4"
                        fill="#ffffff"
                        stroke="#879f98"
                        stroke-width="2"
                      ></circle>
                      <circle
                        cx="210"
                        cy="185"
                        r="4"
                        fill="#ffffff"
                        stroke="#879f98"
                        stroke-width="2"
                      ></circle>
                      <circle
                        cx="300"
                        cy="90"
                        r="6"
                        fill="#ffffff"
                        stroke="#4b615a"
                        stroke-width="2"
                        filter="url(#eq-glow)"
                      ></circle>
                    </g>
                  </svg>