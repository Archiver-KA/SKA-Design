<svg viewBox="0 0 300 120" class="w-full h-auto drop-shadow-lg pointer-events-none">
      <defs>
        <linearGradient id="growthBarGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#74C7FF" stop-opacity="0"></stop>
          <stop offset="100%" stop-color="#9ED8FF" stop-opacity="0.8"></stop>
        </linearGradient>
        <linearGradient id="trendAreaGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#C8EAFF" stop-opacity="0"></stop>
          <stop offset="100%" stop-color="#C8EAFF" stop-opacity="0.3"></stop>
        </linearGradient>
      </defs>

      <!-- Background Elements -->
      <path d="M 0,25 L 300,25 M 0,55 L 300,55 M 0,85 L 300,85" fill="none" stroke="#74C7FF" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.15"></path>

      <!-- Faint Background Pillars -->
      <rect x="25" y="10" width="30" height="100" fill="#9ED8FF" fill-opacity="0.05" rx="2"></rect>
      <rect x="80" y="10" width="30" height="100" fill="#9ED8FF" fill-opacity="0.05" rx="2"></rect>
      <rect x="135" y="10" width="30" height="100" fill="#9ED8FF" fill-opacity="0.05" rx="2"></rect>
      <rect x="190" y="10" width="30" height="100" fill="#9ED8FF" fill-opacity="0.05" rx="2"></rect>
      <rect x="245" y="10" width="30" height="100" fill="#9ED8FF" fill-opacity="0.05" rx="2"></rect>

      <!-- Growing Bars -->
      <rect x="25" y="90" width="30" height="20" fill="url(#growthBarGrad)" rx="2">
        <animate attributeName="height" values="0; 20; 20; 0" keyTimes="0; 0.15; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="y" values="110; 90; 90; 110" keyTimes="0; 0.15; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </rect>

      <rect x="80" y="75" width="30" height="35" fill="url(#growthBarGrad)" rx="2">
        <animate attributeName="height" values="0; 35; 35; 0" keyTimes="0; 0.25; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="y" values="110; 75; 75; 110" keyTimes="0; 0.25; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </rect>

      <rect x="135" y="55" width="30" height="55" fill="url(#growthBarGrad)" rx="2">
        <animate attributeName="height" values="0; 55; 55; 0" keyTimes="0; 0.35; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="y" values="110; 55; 55; 110" keyTimes="0; 0.35; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </rect>

      <rect x="190" y="30" width="30" height="80" fill="url(#growthBarGrad)" rx="2">
        <animate attributeName="height" values="0; 80; 80; 0" keyTimes="0; 0.45; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="y" values="110; 30; 30; 110" keyTimes="0; 0.45; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </rect>

      <rect x="245" y="10" width="30" height="100" fill="url(#growthBarGrad)" rx="2">
        <animate attributeName="height" values="0; 100; 100; 0" keyTimes="0; 0.55; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="y" values="110; 10; 10; 110" keyTimes="0; 0.55; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </rect>

      <!-- Connecting Trend Line -->
      <path d="M 40,90 L 95,75 L 150,55 L 205,30 L 260,10" fill="none" stroke="#C8EAFF" stroke-width="2" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px #C8EAFF)">
        <animate attributeName="stroke-dasharray" values="0,300; 300,0; 300,0; 0,300" keyTimes="0; 0.65; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </path>

      <!-- Trend Area -->
      <path d="M 40,110 L 40,90 L 95,75 L 150,55 L 205,30 L 260,10 L 260,110 Z" fill="url(#trendAreaGrad)">
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.65; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </path>

      <!-- Upward Bubbles -->
      <circle cx="40" r="1.5" fill="#C8EAFF">
        <animate attributeName="cy" values="110; 90" dur="1.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 0" dur="1.5s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="95" r="1.5" fill="#C8EAFF">
        <animate attributeName="cy" values="110; 75" dur="1.8s" begin="0.3s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 0" dur="1.8s" begin="0.3s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="150" r="1.5" fill="#C8EAFF">
        <animate attributeName="cy" values="110; 55" dur="2s" begin="0.6s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 0" dur="2s" begin="0.6s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="205" r="1.5" fill="#C8EAFF">
        <animate attributeName="cy" values="110; 30" dur="2.2s" begin="0.9s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 0" dur="2.2s" begin="0.9s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="260" r="1.5" fill="#C8EAFF">
        <animate attributeName="cy" values="110; 10" dur="2.5s" begin="1.2s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 0" dur="2.5s" begin="1.2s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Nodes -->
      <circle cx="40" cy="90" r="3" fill="#ffffff" style="filter: drop-shadow(0 0 4px #ffffff)">
        <animate attributeName="cy" values="110; 90; 90; 110" keyTimes="0; 0.15; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.9; 1" dur="4s" repeatCount="indefinite">
        </animate>
      </circle>
      <circle cx="95" cy="75" r="3" fill="#ffffff" style="filter: drop-shadow(0 0 4px #ffffff)">
        <animate attributeName="cy" values="110; 75; 75; 110" keyTimes="0; 0.25; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.9; 1" dur="4s" repeatCount="indefinite">
        </animate>
      </circle>
      <circle cx="150" cy="55" r="3" fill="#ffffff" style="filter: drop-shadow(0 0 4px #ffffff)">
        <animate attributeName="cy" values="110; 55; 55; 110" keyTimes="0; 0.35; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.9; 1" dur="4s" repeatCount="indefinite">
        </animate>
      </circle>
      <circle cx="205" cy="30" r="3" fill="#ffffff" style="filter: drop-shadow(0 0 4px #ffffff)">
        <animate attributeName="cy" values="110; 30; 30; 110" keyTimes="0; 0.45; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.4; 0.9; 1" dur="4s" repeatCount="indefinite">
        </animate>
      </circle>
      <circle cx="260" cy="10" r="4" fill="#ffffff" style="filter: drop-shadow(0 0 6px #ffffff)">
        <animate attributeName="cy" values="110; 10; 10; 110" keyTimes="0; 0.55; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.5; 0.9; 1" dur="4s" repeatCount="indefinite">
        </animate>
      </circle>

      <!-- Pulsing Node at the Peak -->
      <circle cx="260" cy="10" r="4" fill="none" stroke="#ffffff" stroke-width="1.5">
        <animate attributeName="cy" values="110; 10; 10; 10; 110" keyTimes="0; 0.55; 0.75; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="r" values="4; 4; 16; 16; 4" keyTimes="0; 0.55; 0.75; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0; 0; 0.8; 0; 0" keyTimes="0; 0.55; 0.65; 0.85; 1" dur="4s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Upward Particles along the trend -->
      <circle r="1.5" fill="#9ED8FF" style="filter: drop-shadow(0 0 3px #9ED8FF)">
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M 40,90 L 95,75 L 150,55 L 205,30 L 260,10">
        </animateMotion>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="2.5s" repeatCount="indefinite"></animate>
      </circle>
      <circle r="1.5" fill="#C8EAFF" style="filter: drop-shadow(0 0 3px #C8EAFF)">
        <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 40,90 L 95,75 L 150,55 L 205,30 L 260,10">
        </animateMotion>
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="3s" begin="1s" repeatCount="indefinite"></animate>
      </circle>
    </svg>