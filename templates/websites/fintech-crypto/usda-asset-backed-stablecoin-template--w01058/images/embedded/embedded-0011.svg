<svg viewBox="0 0 300 120" class="w-full h-auto max-w-full drop-shadow-lg pointer-events-none">
      <defs>
        <!-- Bag Glow Gradient -->
        <radialGradient id="bagGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9ED8FF" stop-opacity="0.5"></stop>
          <stop offset="50%" stop-color="#9ED8FF" stop-opacity="0.15"></stop>
          <stop offset="100%" stop-color="#9ED8FF" stop-opacity="0"></stop>
        </radialGradient>

        <!-- Dollar Token Asset -->
        <g id="dollarSymbol">
          <circle r="8" fill="#050505" stroke="#9ED8FF" stroke-width="1.5" style="filter: drop-shadow(0 0 3px #9ED8FF)"></circle>
          <text x="0" y="4.5" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#9ED8FF" text-anchor="middle">$</text>
        </g>

        <!-- Money Bag Asset -->
        <g id="moneyBag">
          <path d="M-16,-4 C-26,16 -20,32 0,32 C20,32 26,16 16,-4 C10,-10 5,-12 0,-12 C-5,-12 -10,-10 -16,-4 Z" fill="#050505" stroke="#9ED8FF" stroke-width="2" style="filter: drop-shadow(0 0 6px #9ED8FF)"></path>
          <path d="M-10,-12 C-15,-20 -20,-24 -20,-24 C-10,-22 10,-22 20,-24 C20,-24 15,-20 10,-12 Z" fill="#050505" stroke="#9ED8FF" stroke-width="2"></path>
          <path d="M-12,-12 L12,-12" stroke="#9ED8FF" stroke-width="2"></path>
          <text x="0" y="14" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#9ED8FF" text-anchor="middle">$</text>
        </g>
      </defs>

      <!-- Connecting Flow Paths -->
      <path d="M 30,30 C 100,10 180,45 230,55" fill="none" stroke="#9ED8FF" stroke-width="1.5" stroke-dasharray="3 5" stroke-opacity="0.3"></path>
      <path d="M 30,90 C 100,110 180,75 230,65" fill="none" stroke="#9ED8FF" stroke-width="1.5" stroke-dasharray="3 5" stroke-opacity="0.3"></path>
      <path d="M 20,60 C 100,60 180,60 230,60" fill="none" stroke="#9ED8FF" stroke-width="1.5" stroke-dasharray="3 5" stroke-opacity="0.3"></path>

      <!-- Distributed Source Nodes (Left) -->
      <g fill="#050505" stroke="#9ED8FF" stroke-width="2">
        <circle cx="30" cy="30" r="10"></circle>
        <circle cx="30" cy="90" r="10"></circle>
        <circle cx="20" cy="60" r="12"></circle>
      </g>

      <!-- Source Nodes Labels -->
      <g font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#9ED8FF" text-anchor="middle">
        <text x="30" y="34.5">$</text>
        <text x="30" y="94.5">$</text>
        <text x="20" y="64.5">$</text>
      </g>

      <!-- Pulsing Source Rings -->
      <circle cx="30" cy="30" r="10" fill="none" stroke="#9ED8FF" stroke-width="1.5">
        <animate attributeName="r" values="10; 20" dur="2s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8; 0" dur="2s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="30" cy="90" r="10" fill="none" stroke="#9ED8FF" stroke-width="1.5">
        <animate attributeName="r" values="10; 20" dur="2.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8; 0" dur="2.5s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="20" cy="60" r="12" fill="none" stroke="#9ED8FF" stroke-width="1.5">
        <animate attributeName="r" values="12; 24" dur="1.8s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8; 0" dur="1.8s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Flowing Assets (Value Injection to Right Bag) -->
      <!-- Path 1 (Top) -->
      <g>
        <animateMotion dur="3s" repeatCount="indefinite" path="M 30,30 C 100,10 180,45 230,55"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>
      <g>
        <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 30,30 C 100,10 180,45 230,55"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="1s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>
      <g>
        <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M 30,30 C 100,10 180,45 230,55"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="2s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>

      <!-- Path 2 (Bottom) -->
      <g>
        <animateMotion dur="3.3s" begin="0.5s" repeatCount="indefinite" path="M 30,90 C 100,110 180,75 230,65"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.3s" begin="0.5s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>
      <g>
        <animateMotion dur="3.3s" begin="1.6s" repeatCount="indefinite" path="M 30,90 C 100,110 180,75 230,65"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.3s" begin="1.6s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>
      <g>
        <animateMotion dur="3.3s" begin="2.7s" repeatCount="indefinite" path="M 30,90 C 100,110 180,75 230,65"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.3s" begin="2.7s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>

      <!-- Path 3 (Middle) -->
      <g>
        <animateMotion dur="2.7s" begin="0.2s" repeatCount="indefinite" path="M 20,60 C 100,60 180,60 230,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.7s" begin="0.2s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>
      <g>
        <animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite" path="M 20,60 C 100,60 180,60 230,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.7s" begin="1.1s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>
      <g>
        <animateMotion dur="2.7s" begin="2.0s" repeatCount="indefinite" path="M 20,60 C 100,60 180,60 230,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.7s" begin="2.0s" repeatCount="indefinite"></animate>
        <use href="#dollarSymbol"></use>
      </g>

      <!-- Destination Area: Money Bag Hub -->
      <!-- Hub Glow -->
      <circle cx="240" cy="55" r="45" fill="url(#bagGlowGrad)">
        <animate attributeName="r" values="40; 50; 40" dur="2.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.5s" repeatCount="indefinite"></animate>
      </circle>
      
      <!-- Hub Outer Rings -->
      <g transform="translate(240 55)">
        <!-- Absorbing Shockwaves -->
        <circle cx="0" cy="0" r="10" fill="none" stroke="#9ED8FF" stroke-width="1.5">
          <animate attributeName="r" values="10; 45" dur="1.5s" repeatCount="indefinite"></animate>
          <animate attributeName="opacity" values="0; 0.6; 0" keyTimes="0; 0.5; 1" dur="1.5s" repeatCount="indefinite"></animate>
        </circle>
        
        <!-- Rotating Capacity Rings -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#9ED8FF" stroke-width="1" stroke-dasharray="6 8" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"></animateTransform>
        </circle>
        <circle cx="0" cy="0" r="36" fill="none" stroke="#9ED8FF" stroke-width="1" stroke-dasharray="2 12" opacity="0.4">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"></animateTransform>
        </circle>
      </g>
      
      <!-- Core Element: Money Bag -->
      <g transform="translate(240 55)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1; 1.05; 1" dur="2s" repeatCount="indefinite"></animateTransform>
          <use href="#moneyBag"></use>
        </g>
        
        <!-- Pulse Effect on Bag -->
        <g opacity="0.5">
          <animateTransform attributeName="transform" type="scale" values="1; 1.15; 1" dur="2s" repeatCount="indefinite"></animateTransform>
          <animate attributeName="opacity" values="0.5; 0; 0.5" dur="2s" repeatCount="indefinite"></animate>
          <use href="#moneyBag"></use>
        </g>
      </g>
    </svg>