<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="sm:w-4 sm:h-4 w-[14px] h-[14px]" data-icon-replaced="true" style="width: 14px; height: 14px; color: rgb(158, 216, 255);">
        <!-- Central Hub -->
        <circle cx="12" cy="12" r="3" class="">
          <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"></animate>
          <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"></animate>
        </circle>

        <!-- Rotating Data Ring -->
        <circle cx="12" cy="12" r="9" stroke-dasharray="4 4" opacity="0.5" class="">
          <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="8s" repeatCount="indefinite"></animateTransform>
        </circle>

        <!-- Connecting Node 1 (Top) -->
        <path d="M12 9V3">
          <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"></animate>
        </path>
        <circle cx="12" cy="2" r="1.5" opacity="0.8" fill="currentColor">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"></animate>
        </circle>

        <!-- Connecting Node 2 (Bottom Left) -->
        <path d="M9.5 13.5L5 17.5" class="">
          <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" begin="0.6s" repeatCount="indefinite">
          </animate>
        </path>
        <circle cx="4" cy="18.5" r="1.5" opacity="0.8" fill="currentColor" class="">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"></animate>
        </circle>

        <!-- Connecting Node 3 (Bottom Right) -->
        <path d="M14.5 13.5L19 17.5" class="">
          <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" begin="1.3s" repeatCount="indefinite">
          </animate>
        </path>
        <circle cx="20" cy="18.5" r="1.5" opacity="0.8" fill="currentColor">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.3s" repeatCount="indefinite"></animate>
        </circle>
      </svg>