<svg viewBox="0 0 300 120" class="w-full h-auto max-w-full drop-shadow-lg pointer-events-none">
      <defs>
        <!-- Central Hub Glow -->
        <radialGradient id="hubGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#CFAE6E" stop-opacity="0.3"></stop>
          <stop offset="50%" stop-color="#CFAE6E" stop-opacity="0.1"></stop>
          <stop offset="100%" stop-color="#CFAE6E" stop-opacity="0"></stop>
        </radialGradient>

        <!-- Project Payload Shapes -->
        <g id="shape-rect">
          <rect x="-2.5" y="-2.5" width="5" height="5" fill="#ffffff" style="filter: drop-shadow(0 0 4px #CFAE6E)"></rect>
        </g>
        <g id="shape-hex">
          <polygon points="0,-3.5 3,-1.8 3,1.8 0,3.5 -3,1.8 -3,-1.8" fill="#ffffff" style="filter: drop-shadow(0 0 4px #CFAE6E)"></polygon>
        </g>
        <g id="shape-tri">
          <polygon points="0,-3.5 3.5,2.5 -3.5,2.5" fill="#ffffff" style="filter: drop-shadow(0 0 4px #CFAE6E)"></polygon>
        </g>
        <g id="shape-diamond">
          <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="#ffffff" style="filter: drop-shadow(0 0 4px #CFAE6E)"></polygon>
        </g>
        <g id="shape-pent">
          <polygon points="0,-3.5 3.3,-1 2.1,3 -2.1,3 -3.3,-1" fill="#ffffff" style="filter: drop-shadow(0 0 4px #CFAE6E)"></polygon>
        </g>
        <g id="shape-circle">
          <circle cx="0" cy="0" r="2.5" fill="#ffffff" style="filter: drop-shadow(0 0 4px #CFAE6E)"></circle>
        </g>

        <!-- Project Source Nodes -->
        <g id="node-rect">
          <rect x="-8" y="-8" width="16" height="16" fill="#050505" stroke="#CFAE6E" stroke-width="1.5"></rect>
          <rect x="-2" y="-2" width="4" height="4" fill="#CFAE6E">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"></animate>
          </rect>
        </g>
        <g id="node-hex">
          <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="#050505" stroke="#CFAE6E" stroke-width="1.5"></polygon>
          <polygon points="0,-2.5 2.2,-1.2 2.2,1.2 0,2.5 -2.2,1.2 -2.2,-1.2" fill="#CFAE6E">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"></animate>
          </polygon>
        </g>
        <g id="node-tri">
          <polygon points="0,-9 8,5 -8,5" fill="#050505" stroke="#CFAE6E" stroke-width="1.5"></polygon>
          <polygon points="0,-2.5 2.2,1.5 -2.2,1.5" fill="#CFAE6E">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"></animate>
          </polygon>
        </g>
        <g id="node-diamond">
          <polygon points="0,-9 9,0 0,9 -9,0" fill="#050505" stroke="#CFAE6E" stroke-width="1.5"></polygon>
          <polygon points="0,-3 3,0 0,3 -3,0" fill="#CFAE6E">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"></animate>
          </polygon>
        </g>
        <g id="node-pent">
          <polygon points="0,-9 8.5,-2.8 5.3,7 -5.3,7 -8.5,-2.8" fill="#050505" stroke="#CFAE6E" stroke-width="1.5"></polygon>
          <polygon points="0,-2.5 2.4,-0.8 1.5,2 -1.5,2 -2.4,-0.8" fill="#CFAE6E">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"></animate>
          </polygon>
        </g>
        <g id="node-circle">
          <circle cx="0" cy="0" r="9" fill="#050505" stroke="#CFAE6E" stroke-width="1.5"></circle>
          <circle cx="0" cy="0" r="3" fill="#CFAE6E">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"></animate>
          </circle>
        </g>
      </defs>

      <!-- Connecting API Paths -->
      <path d="M 30,60 Q 90,20 150,60" fill="none" stroke="#CFAE6E" stroke-opacity="0.3" stroke-dasharray="4 4" stroke-width="1.5"></path>
      <path d="M 70,20 Q 110,40 150,60" fill="none" stroke="#CFAE6E" stroke-opacity="0.3" stroke-dasharray="4 4" stroke-width="1.5"></path>
      <path d="M 70,100 Q 110,80 150,60" fill="none" stroke="#CFAE6E" stroke-opacity="0.3" stroke-dasharray="4 4" stroke-width="1.5"></path>
      <path d="M 230,20 Q 190,40 150,60" fill="none" stroke="#CFAE6E" stroke-opacity="0.3" stroke-dasharray="4 4" stroke-width="1.5"></path>
      <path d="M 230,100 Q 190,80 150,60" fill="none" stroke="#CFAE6E" stroke-opacity="0.3" stroke-dasharray="4 4" stroke-width="1.5"></path>
      <path d="M 270,60 Q 210,100 150,60" fill="none" stroke="#CFAE6E" stroke-opacity="0.3" stroke-dasharray="4 4" stroke-width="1.5"></path>

      <!-- API Gateway Checkpoints -->
      <g fill="#050505" stroke="#CFAE6E" stroke-width="1">
        <rect x="88" y="38" width="4" height="4" rx="1"></rect>
        <rect x="108" y="38" width="4" height="4" rx="1"></rect>
        <rect x="108" y="78" width="4" height="4" rx="1"></rect>
        <rect x="188" y="38" width="4" height="4" rx="1"></rect>
        <rect x="188" y="78" width="4" height="4" rx="1"></rect>
        <rect x="208" y="78" width="4" height="4" rx="1"></rect>
      </g>

      <!-- Animated Data Payloads Flowing to Center -->
      <use href="#shape-rect">
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M 30,60 Q 90,20 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.5s" repeatCount="indefinite"></animate>
      </use>
      <use href="#shape-hex">
        <animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M 70,20 Q 110,40 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3s" begin="0.5s" repeatCount="indefinite"></animate>
      </use>
      <use href="#shape-tri">
        <animateMotion dur="2.8s" begin="1s" repeatCount="indefinite" path="M 70,100 Q 110,80 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="1s" repeatCount="indefinite"></animate>
      </use>
      <use href="#shape-diamond">
        <animateMotion dur="3.2s" begin="0.2s" repeatCount="indefinite" path="M 230,20 Q 190,40 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.2s" begin="0.2s" repeatCount="indefinite"></animate>
      </use>
      <use href="#shape-pent">
        <animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite" path="M 230,100 Q 190,80 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.6s" begin="1.2s" repeatCount="indefinite"></animate>
      </use>
      <use href="#shape-circle">
        <animateMotion dur="2.9s" begin="0.8s" repeatCount="indefinite" path="M 270,60 Q 210,100 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.9s" begin="0.8s" repeatCount="indefinite"></animate>
      </use>

      <!-- Ecosystem Projects (Outer Sources) -->
      <g transform="translate(30 60)">
        <use href="#node-rect" x="0" y="0"></use>
        <circle cx="0" cy="0" r="14" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"></animateTransform>
        </circle>
      </g>
      
      <g transform="translate(70 20)">
        <use href="#node-hex" x="0" y="0"></use>
      </g>
      
      <g transform="translate(70 100)">
        <use href="#node-tri" x="0" y="0"></use>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="3 6" stroke-opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"></animateTransform>
        </circle>
      </g>
      
      <g transform="translate(230 20)">
        <use href="#node-diamond" x="0" y="0"></use>
      </g>
      
      <g transform="translate(230 100)">
        <use href="#node-pent" x="0" y="0"></use>
      </g>
      
      <g transform="translate(270 60)">
        <use href="#node-circle" x="0" y="0"></use>
        <circle cx="0" cy="0" r="18" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"></animateTransform>
        </circle>
      </g>

      <!-- Central API Hub -->
      <circle cx="150" cy="60" r="50" fill="url(#hubGlowGrad)"></circle>
      
      <!-- Central Hub Outer Rings -->
      <g transform="translate(150 60)">
        <circle cx="0" cy="0" r="35" fill="none" stroke="#CFAE6E" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"></animateTransform>
        </circle>
        
        <!-- API Gateway Text Ring -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"></animateTransform>
          <path id="apiTextPath" d="M -38,0 A 38,38 0 1,1 38,0 A 38,38 0 1,1 -38,0" fill="none"></path>
          <text font-size="4" fill="#CFAE6E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="600" opacity="0.6" letter-spacing="1.5">
            <textPath href="#apiTextPath" startOffset="0">
              API GATEWAY • API GATEWAY • API GATEWAY • API GATEWAY • API GATEWAY • API GATEWAY • 
            </textPath>
          </text>
        </g>

        <circle cx="0" cy="0" r="28" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-opacity="0.4">
          <animate attributeName="r" values="28; 30; 28" dur="4s" repeatCount="indefinite"></animate>
        </circle>
        <circle cx="0" cy="0" r="22" fill="none" stroke="#CFAE6E" stroke-width="2" stroke-dasharray="10 20" stroke-opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"></animateTransform>
        </circle>
      </g>
      
      <!-- Inner Solid Base -->
      <circle cx="150" cy="60" r="16" fill="#050505" stroke="#CFAE6E" stroke-width="2"></circle>
      
      <!-- API Brackets & Core -->
      <text x="150" y="60" font-size="14" fill="#CFAE6E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="600" text-anchor="middle" dominant-baseline="central">{ }</text>
      <circle cx="150" cy="60" r="2" fill="#CFAE6E">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Broadcast Ripples (Data Sync) -->
      <circle cx="150" cy="60" r="16" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="2 4">
        <animate attributeName="r" values="16; 60" dur="3s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8; 0" dur="3s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="150" cy="60" r="16" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="2 4">
        <animate attributeName="r" values="16; 60" dur="3s" begin="1.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8; 0" dur="3s" begin="1.5s" repeatCount="indefinite"></animate>
      </circle>
    </svg>