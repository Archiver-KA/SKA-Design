<svg viewBox="0 0 300 120" class="w-full h-auto drop-shadow-lg pointer-events-none">
      <defs>
        <!-- Central Hub Glow -->
        <radialGradient id="hubGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#CFAE6E" stop-opacity="0.4"></stop>
          <stop offset="40%" stop-color="#CFAE6E" stop-opacity="0.15"></stop>
          <stop offset="100%" stop-color="#CFAE6E" stop-opacity="0"></stop>
        </radialGradient>

        <!-- Asset Definitions -->
        <g id="goldCoin">
          <circle r="4.5" fill="#CFAE6E" stroke="#050505" stroke-width="0.5" style="filter: drop-shadow(0 0 3px #CFAE6E)"></circle>
          <circle r="2.5" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.8"></circle>
          <circle r="1" fill="#ffffff"></circle>
        </g>

        <g id="blueToken">
          <circle r="4" fill="#9ED8FF" stroke="#050505" stroke-width="0.5" style="filter: drop-shadow(0 0 3px #9ED8FF)">
          </circle>
          <rect x="-1.5" y="-1.5" width="3" height="3" fill="none" stroke="#ffffff" stroke-width="0.5"></rect>
        </g>

        <g id="silverCoin">
          <circle r="3.5" fill="#ffffff" stroke="#050505" stroke-width="0.5" style="filter: drop-shadow(0 0 2px #ffffff)"></circle>
          <circle r="1.5" fill="none" stroke="#9ED8FF" stroke-width="0.5" opacity="0.8"></circle>
        </g>
      </defs>

      <!-- Connecting Flow Paths -->
      <path d="M 20,20 Q 80,10 150,60" fill="none" stroke="#CFAE6E" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.25"></path>
      <path d="M 20,100 Q 80,110 150,60" fill="none" stroke="#9ED8FF" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.25"></path>
      <path d="M 280,20 Q 220,10 150,60" fill="none" stroke="#CFAE6E" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.25"></path>
      <path d="M 280,100 Q 220,110 150,60" fill="none" stroke="#9ED8FF" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.25"></path>
      <path d="M 10,60 C 50,20 100,100 150,60" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.15"></path>
      <path d="M 290,60 C 250,100 200,20 150,60" fill="none" stroke="#CFAE6E" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.15"></path>

      <!-- Distributed Source Nodes -->
      <g fill="#050505" stroke="#CFAE6E" stroke-width="1.5">
        <circle cx="20" cy="20" r="8"></circle>
        <circle cx="280" cy="20" r="8"></circle>
        <circle cx="10" cy="60" r="10"></circle>
        <circle cx="290" cy="60" r="10"></circle>
      </g>
      <g fill="#050505" stroke="#9ED8FF" stroke-width="1.5">
        <circle cx="20" cy="100" r="8"></circle>
        <circle cx="280" cy="100" r="8"></circle>
      </g>

      <!-- Pulsing Cores in Source Nodes -->
      <circle cx="20" cy="20" r="2" fill="#CFAE6E">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="280" cy="20" r="2" fill="#CFAE6E">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="10" cy="60" r="3" fill="#CFAE6E">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="290" cy="60" r="3" fill="#CFAE6E">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="20" cy="100" r="2" fill="#9ED8FF">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="280" cy="100" r="2" fill="#9ED8FF">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"></animate>
      </circle>

      <!-- Flowing Assets (Value Return to Center) -->
      <!-- Path 1 (Top Left) -->
      <g>
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M 20,20 Q 80,10 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.5s" repeatCount="indefinite">
        </animate>
        <use href="#goldCoin"></use>
      </g>
      <g>
        <animateMotion dur="2.5s" begin="1.25s" repeatCount="indefinite" path="M 20,20 Q 80,10 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.5s" begin="1.25s" repeatCount="indefinite"></animate>
        <use href="#blueToken"></use>
      </g>
      <g>
        <animateMotion dur="3.5s" begin="0.5s" repeatCount="indefinite" path="M 20,20 Q 80,10 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.5s" begin="0.5s" repeatCount="indefinite"></animate>
        <use href="#silverCoin"></use>
      </g>

      <!-- Path 2 (Bottom Left) -->
      <g>
        <animateMotion dur="2.8s" repeatCount="indefinite" path="M 20,100 Q 80,110 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.8s" repeatCount="indefinite">
        </animate>
        <use href="#silverCoin"></use>
      </g>
      <g>
        <animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M 20,100 Q 80,110 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"></animate>
        <use href="#goldCoin"></use>
      </g>

      <!-- Path 3 (Top Right) -->
      <g>
        <animateMotion dur="3s" repeatCount="indefinite" path="M 280,20 Q 220,10 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" repeatCount="indefinite">
        </animate>
        <use href="#blueToken"></use>
      </g>
      <g>
        <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M 280,20 Q 220,10 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" begin="1.5s" repeatCount="indefinite"></animate>
        <use href="#goldCoin"></use>
      </g>
      <g>
        <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M 280,20 Q 220,10 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"></animate>
        <use href="#goldCoin"></use>
      </g>

      <!-- Path 4 (Bottom Right) -->
      <g>
        <animateMotion dur="2.2s" repeatCount="indefinite" path="M 280,100 Q 220,110 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.2s" repeatCount="indefinite">
        </animate>
        <use href="#goldCoin"></use>
      </g>
      <g>
        <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 280,100 Q 220,110 150,60">
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"></animate>
        <use href="#silverCoin"></use>
      </g>

      <!-- Path 5 (Left Curved) -->
      <g>
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 10,60 C 50,20 100,100 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.2s" repeatCount="indefinite">
        </animate>
        <use href="#goldCoin"></use>
      </g>
      <g>
        <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M 10,60 C 50,20 100,100 150,60">
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"></animate>
        <use href="#blueToken"></use>
      </g>

      <!-- Path 6 (Right Curved) -->
      <g>
        <animateMotion dur="2.9s" repeatCount="indefinite" path="M 290,60 C 250,100 200,20 150,60"></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.9s" repeatCount="indefinite">
        </animate>
        <use href="#silverCoin"></use>
      </g>
      <g>
        <animateMotion dur="2.9s" begin="1.45s" repeatCount="indefinite" path="M 290,60 C 250,100 200,20 150,60">
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.9s" begin="1.45s" repeatCount="indefinite"></animate>
        <use href="#goldCoin"></use>
      </g>

      <!-- Center Accumulation / System Growth Hub -->
      <circle cx="150" cy="60" r="55" fill="url(#hubGlowGrad)">
        <animate attributeName="r" values="45; 60; 45" dur="3s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite"></animate>
      </circle>

      <!-- System Growth Outer Rings -->
      <g transform="translate(150 60)">
        <!-- Expanding shockwaves expressing absorbing value -->
        <circle cx="0" cy="0" r="15" fill="none" stroke="#CFAE6E" stroke-width="2">
          <animate attributeName="r" values="15; 65" dur="2.5s" repeatCount="indefinite"></animate>
          <animate attributeName="opacity" values="0.8; 0" dur="2.5s" repeatCount="indefinite"></animate>
        </circle>
        <circle cx="0" cy="0" r="15" fill="none" stroke="#9ED8FF" stroke-width="1.5">
          <animate attributeName="r" values="15; 55" dur="2.5s" begin="1.25s" repeatCount="indefinite"></animate>
          <animate attributeName="opacity" values="0.6; 0" dur="2.5s" begin="1.25s" repeatCount="indefinite"></animate>
        </circle>

        <!-- Rotating Capacity/Value Rings -->
        <circle cx="0" cy="0" r="32" fill="none" stroke="#CFAE6E" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.9">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"></animateTransform>
          <animate attributeName="r" values="30; 36; 30" dur="4s" repeatCount="indefinite"></animate>
        </circle>
        <circle cx="0" cy="0" r="42" fill="none" stroke="#9ED8FF" stroke-width="1.5" stroke-dasharray="4 12" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"></animateTransform>
          <animate attributeName="r" values="42; 46; 42" dur="5s" repeatCount="indefinite"></animate>
        </circle>

        <!-- Ambient System Energy Particles -->
        <circle cx="0" cy="0" r="1.5" fill="#CFAE6E">
          <animateTransform attributeName="transform" type="translate" values="0,0; 25,-35" dur="3s" repeatCount="indefinite"></animateTransform>
          <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="3s" repeatCount="indefinite">
          </animate>
        </circle>
        <circle cx="0" cy="0" r="1.5" fill="#9ED8FF">
          <animateTransform attributeName="transform" type="translate" values="0,0; -30,25" dur="3.5s" begin="1s" repeatCount="indefinite"></animateTransform>
          <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="3.5s" begin="1s" repeatCount="indefinite"></animate>
        </circle>
        <circle cx="0" cy="0" r="2" fill="#ffffff">
          <animateTransform attributeName="transform" type="translate" values="0,0; -35,-20" dur="4s" begin="2s" repeatCount="indefinite"></animateTransform>
          <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="4s" begin="2s" repeatCount="indefinite"></animate>
        </circle>
      </g>

      <!-- Strong Solid Core Vault -->
      <circle cx="150" cy="60" r="16" fill="#050505" stroke="#CFAE6E" stroke-width="3" style="filter: drop-shadow(0 0 10px #CFAE6E)"></circle>

      <!-- Core Beating Heart -->
      <circle cx="150" cy="60" r="8" fill="#CFAE6E">
        <animate attributeName="r" values="6; 10; 6" dur="1.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="1.5s" repeatCount="indefinite"></animate>
      </circle>
      <!-- Core Inner Reflection -->
      <circle cx="150" cy="60" r="4" fill="#ffffff">
        <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.5s" repeatCount="indefinite"></animate>
      </circle>
    </svg>