<svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
                <defs>
                   <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="rgba(255,255,255,0.02)" />
                      <stop offset="50%" stop-color="rgba(59, 130, 246, 0.4)" />
                      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
                   </linearGradient>
                </defs>
                <!-- Connections from nodes to center -->
                <!-- Top (TMS) -->
                <path d="M300 100 L300 230" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                <circle cx="300" cy="165" r="2" fill="#60A5FA" class="animate-ping opacity-20" style="animation-duration: 3s;" />

                <!-- Top Right (Excel) -->
                <path d="M480 140 Q 380 180 380 250" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                
                <!-- Right (Portals) -->
                <path d="M520 300 L 410 300" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                <path d="M520 300 L 410 300" stroke="#60A5FA" stroke-width="1" fill="none" class="animate-flow" />

                <!-- Bottom Right (Email) -->
                <path d="M480 460 Q 380 420 380 350" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                
                <!-- Bottom (GPS) -->
                <path d="M300 500 L 300 370" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                
                <!-- Bottom Left (Docs) -->
                <path d="M120 460 Q 220 420 220 350" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                <path d="M120 460 Q 220 420 220 350" stroke="#60A5FA" stroke-width="1" fill="none" class="animate-flow" style="animation-delay: 1s;" />

                <!-- Left (External) -->
                <path d="M80 300 L 190 300" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
                
                <!-- Top Left (API) -->
                <path d="M120 140 Q 220 180 220 250" stroke="url(#lineGrad)" stroke-width="1" fill="none" class="opacity-30" />
             </svg>