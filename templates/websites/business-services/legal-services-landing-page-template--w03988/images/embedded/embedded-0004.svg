<svg viewBox="0 0 400 350" class="w-full h-full drop-shadow-2xl">
                                <!-- Background Square -->
                                <rect x="220" y="40" width="140" height="140" rx="20" class="fill-indigo-100 anim-float-delayed" transform="rotate(10 290 110)" />
                                
                                <!-- File Folder Bottom Left -->
                                <g transform="translate(40, 180)" class="anim-float">
                                    <path d="M0 20 H50 L60 0 H140 V20 H160 V120 H0 V20 Z" class="fill-indigo-500" />
                                    <!-- Paper inside -->
                                    <rect x="20" y="-30" width="100" height="80" class="fill-white shadow-sm" />
                                    <rect x="30" y="-10" width="60" height="4" class="fill-slate-200" />
                                    <rect x="30" y="5" width="80" height="4" class="fill-slate-200" />
                                    <!-- Folder Front -->
                                    <path d="M0 120 V40 H160 V120 H0 Z" class="fill-indigo-400 opacity-90" />
                                </g>

                                <!-- Main Browser/Evidence Window -->
                                <g transform="translate(100, 80)" class="anim-float">
                                    <rect x="0" y="0" width="220" height="160" rx="8" class="fill-white shadow-xl border border-slate-100" />
                                    <!-- Window Header -->
                                    <rect x="0" y="0" width="220" height="30" rx="8" class="fill-blue-950" />
                                    <circle cx="15" cy="15" r="3" class="fill-rose-500" />
                                    <circle cx="25" cy="15" r="3" class="fill-indigo-400" />
                                    <circle cx="35" cy="15" r="3" class="fill-indigo-200" />
                                    
                                    <!-- Image Area -->
                                    <rect x="20" y="50" width="100" height="80" rx="4" class="fill-slate-100" />
                                    <!-- Abstract Image Content -->
                                    <circle cx="70" cy="90" r="15" class="fill-indigo-300" />
                                    <path d="M40 130 L60 100 L80 130" class="fill-indigo-200" />
                                    
                                    <!-- Side Text Lines -->
                                    <rect x="140" y="50" width="60" height="6" rx="3" class="fill-slate-200" />
                                    <rect x="140" y="65" width="40" height="6" rx="3" class="fill-slate-200" />
                                    <rect x="140" y="80" width="50" height="6" rx="3" class="fill-slate-200" />
                                    
                                    <!-- Checkmark Badge -->
                                    <circle cx="210" cy="150" r="20" class="fill-green-500 shadow-md" />
                                    <path d="M202 150 L208 156 L218 144" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                                </g>
                            </svg>